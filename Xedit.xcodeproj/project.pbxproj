			shellPath = /bin/zsh;
			shellScript = "set -euo pipefail\n\n# Debug / CI 一律跳过 —— Debug 用 Library Validation entitlement\n# 解决 dylib 加载（rc1 验过），CI 用 CODE_SIGNING_ALLOWED=NO 跳过\n# 整个签名链路，重签反而可能引入 PTY 启动问题。Release archive 才走\n# 这条路径。\nif [ \"${CONFIGURATION:-}\" != \"Release\" ]; then\n  echo \"Skipping ONNX dylib re-sign on configuration='${CONFIGURATION:-unknown}'\"\n  exit 0\nfi\n\nSRC_DYLIB=\"${SRCROOT}/Xedit/Voice/Libraries/onnxruntime/libonnxruntime.1.23.2.dylib\"\nif [ ! -f \"${SRC_DYLIB}\" ]; then\n  echo \"warning: ONNX dylib not found at ${SRC_DYLIB}\"\n  exit 0\nfi\n\nDEST_DIR=\"${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\nmkdir -p \"${DEST_DIR}\"\nDEST_DYLIB=\"${DEST_DIR}/libonnxruntime.1.23.2.dylib\"\ncp -f \"${SRC_DYLIB}\" \"${DEST_DYLIB}\"\ncd \"${DEST_DIR}\"\nrm -f libonnxruntime.dylib\nln -s libonnxruntime.1.23.2.dylib libonnxruntime.dylib\n\nif [ \"${CODE_SIGNING_ALLOWED:-YES}\" = \"NO\" ]; then\n  SIGN=\"-\"\nelse\n  SIGN=\"${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}\"\n  [ -n \"${SIGN}\" ] || SIGN=\"-\"\nfi\nif [ \"${SIGN}\" != \"-\" ] && [ -n \"${DEVELOPMENT_TEAM:-}\" ]; then\n  identity_output=\"$(security find-identity -v -p codesigning 2>/dev/null || true)\"\n  resolved_sign=\"$(/usr/bin/awk -v label=\"${SIGN}\" -v team=\"$DEVELOPMENT_TEAM\" 'index($0, label) > 0 && index($0, \"(\" team \")\") > 0 { print $2; exit }' <<< \"$identity_output\")\"\n  [ -z \"$resolved_sign\" ] || SIGN=\"$resolved_sign\"\nfi\necho \"Re-signing ${DEST_DYLIB} with identity: ${SIGN}\"\ncodesign --remove-signature \"${DEST_DYLIB}\" 2>/dev/null || true\ncodesign --force --sign \"${SIGN}\" --timestamp=none \"${DEST_DYLIB}\"\necho \"ONNX dylib re-signed and ready for distribution\"\n";
