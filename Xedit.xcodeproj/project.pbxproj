epComputerUseHelper\"\nif [ \"${CODE_SIGNING_ALLOWED:-YES}\" = \"NO\" ]; then\n  sign=\"-\"\nelse\n  sign=\"${EXPANDED_CODE_SIGN_IDENTITY:-${CODE_SIGN_IDENTITY:--}}\"\n  [ -n \"$sign\" ] || sign=\"-\"\nfi\nif [ \"$sign\" != \"-\" ] && [ -n \"${DEVELOPMENT_TEAM:-}\" ]; then\n  identity_output=\"$(security find-identity -v -p codesigning 2>/dev/null || true)\"\n  resolved_sign=\"$(/usr/bin/awk -v label=\"$sign\" -v team=\"$DEVELOPMENT_TEAM\" 'index($0, label) > 0 && index($0, \"(\" team \")\") > 0 { print $2; exit }' <<< \"$identity_output\")\"\n  [ -z \"$resolved_sign\" ] || sign=\"$resolved_sign\"\nfi\nlog_step \"Code signing identity: ${sign}\"\nsign_start=\"$(date +%s)\"\nlog_step \"START codesign helper app\"\nif codesign --force --sign \"$sign\" --timestamp=none \"$app\"; then\n  sign_elapsed=$(($(date +%s) - sign_start))\n  log_step \"DONE codesign helper app (${sign_elapsed}s)\"\nelse\n  exit_code=$?\n  sign_elapsed=$(($(date +%s) - sign_start))\n  log_step \"FAILED codesign helper app (${sign_elapsed}s, status=${exit_code})\"\n  log_step \"Bundle diagnostics for ${app}:\"\n  find \"$app\" -maxdepth 3 -print\n  codesign --display --verbose=4 \"$app\" 2>&1 || true\n  exit \"$exit_code\"\nfi\ntime_step \"codesign verify helper app\" codesign --verify --deep --strict --verbose=2 \"$app\"\ntotal_elapsed=$(($(date +%s) - build_start))\nlog_step \"Computer Use Helper build finished (${total_elapsed}s)\"\n";
