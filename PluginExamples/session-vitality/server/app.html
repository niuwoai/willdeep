<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Vitality</title>
<style>
/*
 * 会话体检中心（MCP App 页面）。
 *
 * 配色一律从宿主注入的 --willdeep-* 变量派生：这个页面跑在 WKWebView 里，
 * prefers-color-scheme 不一定跟 App 的深浅色一致，宿主变量才是权威。
 * 布局只用 %、flex 与 grid —— 插件页宽度由宿主分栏决定，vw 会算错。
 */
:root {
  --fg: var(--willdeep-fg, #1d1d1f);
  --muted: var(--willdeep-secondary, #6e6e73);
  --surface: color-mix(in srgb, var(--fg) 5%, transparent);
  --surface-strong: color-mix(in srgb, var(--fg) 9%, transparent);
  --border: color-mix(in srgb, var(--fg) 15%, transparent);
  --border-strong: color-mix(in srgb, var(--fg) 32%, transparent);
  --bar: color-mix(in srgb, var(--fg) 55%, transparent);
  --bar-strong: var(--fg);
  --warn: #d99b1c;
  --danger: #e5484d;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--fg);
  padding: 18px 20px 28px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.hidden { display: none !important; }

header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
h1 { font-size: 17px; font-weight: 650; letter-spacing: .2px; }
.subtitle { color: var(--muted); font-size: 11.5px; }
.toolbar { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.chip {
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 4px 11px;
  font-size: 12px;
  white-space: nowrap;
}
.chip:hover { border-color: var(--border-strong); }
.chip:disabled { opacity: .5; cursor: default; }

.banner {
  border: 1px solid var(--border);
  border-left: 3px solid var(--warn);
  border-radius: 8px;
  background: var(--surface);
  padding: 8px 12px;
  font-size: 12px;
  margin-bottom: 14px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.banner.error { border-left-color: var(--danger); color: var(--danger); }
.banner .spacer { margin-left: auto; }

h2 {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .4px;
  text-transform: uppercase;
  margin: 22px 0 9px;
}
h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 8px; }

/* ── KPI ─────────────────────────────────────────────── */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; }
.card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 11px 13px;
}
.card .num { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.card .num .unit { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.card .lbl { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.card .sub { font-size: 11px; color: var(--muted); margin-top: 5px; opacity: .85; }

/* ── 趋势柱状图 ───────────────────────────────────────── */
.trend {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  height: 110px;
  padding: 10px 12px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
}
.trend .col { flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.trend .bar {
  background: var(--bar);
  border-radius: 3px 3px 0 0;
  min-height: 2px;
  transition: opacity .12s ease;
}
.trend .col:hover .bar { background: var(--bar-strong); }
.trend .col.today .bar { background: var(--bar-strong); }
.trend .day { font-size: 9.5px; color: var(--muted); text-align: center; padding: 5px 0 6px; white-space: nowrap; }
.trend .col.today .day { color: var(--fg); font-weight: 600; }

/* ── 排行表 ──────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; }
th {
  font-size: 11px; color: var(--muted); text-align: left;
  padding: 4px 6px; border-bottom: 1px solid var(--border); font-weight: 500;
}
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
td { padding: 7px 6px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface); }
td.name { font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.muted, .muted { color: var(--muted); }
.meter { height: 5px; background: var(--surface-strong); border-radius: 3px; overflow: hidden; min-width: 60px; }
.meter > span { display: block; height: 100%; background: var(--bar); border-radius: 3px; }

/* ── 最近会话 ─────────────────────────────────────────── */
.recent { display: flex; flex-direction: column; gap: 7px; }
.recent .row {
  display: flex; align-items: baseline; gap: 9px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--surface); padding: 8px 11px;
}
.recent .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46%; }
.recent .tag {
  font-size: 11px; color: var(--muted);
  background: var(--surface-strong); border-radius: 4px; padding: 1px 6px;
}
.recent .spacer { margin-left: auto; }
.recent .stat { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ── 状态位 ──────────────────────────────────────────── */
.state { padding: 40px 12px; text-align: center; color: var(--muted); }
.state .headline { color: var(--fg); font-size: 14px; margin-bottom: 6px; }
.state.error .headline { color: var(--danger); }
.skeleton { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; }
.skeleton div { height: 66px; border-radius: var(--radius); background: var(--surface); animation: pulse 1.4s ease-in-out infinite; }
.skeleton div:nth-child(2) { animation-delay: .15s; }
.skeleton div:nth-child(3) { animation-delay: .3s; }
.skeleton div:nth-child(4) { animation-delay: .45s; }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: .9; } }
footer { margin-top: 24px; font-size: 11px; color: var(--muted); line-height: 1.7; }
footer code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--surface-strong); border-radius: 4px; padding: 1px 5px;
}
@media (prefers-reduced-motion: reduce) { .skeleton div { animation: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Session Vitality</h1>
  <span class="subtitle" id="generated"></span>
  <div class="toolbar">
    <button class="chip" id="export" type="button"></button>
    <button class="chip" id="refresh" type="button"></button>
  </div>
</header>

<div class="banner hidden" id="banner">
  <span id="banner-text"></span>
  <span class="spacer"></span>
  <button class="chip hidden" id="banner-action" type="button"></button>
</div>

<div class="skeleton" id="skeleton"><div></div><div></div><div></div><div></div></div>
<div class="state hidden" id="state"></div>
<main id="main" class="hidden">
  <div class="grid" id="kpis"></div>

  <h2 id="trend-title">Trend<span class="hint" id="trend-hint"></span></h2>
  <div class="trend" id="trend"></div>

  <h2 id="projects-title">Projects</h2>
  <div id="projects-wrap"></div>

  <h2 id="models-title">Models</h2>
  <div id="models-wrap"></div>

  <h2 id="recent-title">Recent sessions</h2>
  <div class="recent" id="recent"></div>

  <footer id="foot"></footer>
</main>

<script>
(function () {
  'use strict';

  // ── i18n ───────────────────────────────────────────────
  var STRINGS = {
    zh: {
      title: '会话体检中心',
      refresh: '刷新',
      refreshing: '刷新中…',
      export: '导出 Markdown',
      exporting: '导出中…',
      exported: '已复制到剪贴板',
      exportFailed: '导出失败',
      demo: '演示数据 —— 没找到真实的会话存储，下面的数字都是示例。',
      errorTitle: '读不到会话统计',
      retry: '重试',
      emptyTitle: '还没有会话数据',
      emptyBody: '在 WillDeep 里聊上几轮，这里就会有东西看了。',
      sessions: '会话数',
      activeSessions: '有对话的会话',
      messages: '消息数',
      toolCalls: '工具调用',
      output: '输出 Token',
      outputToday: '今日输出',
      outputWeek: '近 7 天',
      billed: '计费 Token',
      cacheRate: '缓存命中',
      avgSeconds: '平均响应',
      edited: '改过文件的会话',
      artifacts: '产物文件',
      requests: '模型请求',
      seconds: '秒',
      trend: '近 14 天',
      trendHint: '每天的输出 Token',
      projects: '项目',
      models: '模型',
      recent: '最近会话',
      sessionsCount: function (n) { return n + ' 个会话'; },
      project: '项目',
      lastActive: '最后活跃',
      empty: '暂无数据',
      justNow: '刚刚',
      minutesAgo: function (n) { return n + ' 分钟前'; },
      hoursAgo: function (n) { return n + ' 小时前'; },
      daysAgo: function (n) { return n + ' 天前'; },
      footNote: '输出 Token 是模型真正生成的量；计费 Token 按每次请求上报的用量累加，'
        + '同一段上下文在多轮里会被重复计费，所以它远大于输出。缓存命中 = 命中缓存的 prompt ÷ 全部 prompt。',
      footScan: function (files, ms) { return '扫描 ' + files + ' 个会话文件，用时 ' + ms + ' ms。'; }
    },
    en: {
      title: 'Session Vitality',
      refresh: 'Refresh',
      refreshing: 'Refreshing…',
      export: 'Export Markdown',
      exporting: 'Exporting…',
      exported: 'Copied to clipboard',
      exportFailed: 'Export failed',
      demo: 'Demo data — no real session store was found, every number below is a sample.',
      errorTitle: 'Could not read session stats',
      retry: 'Retry',
      emptyTitle: 'No session data yet',
      emptyBody: 'Chat a few turns in WillDeep and this page fills up.',
      sessions: 'Sessions',
      activeSessions: 'Sessions with messages',
      messages: 'Messages',
      toolCalls: 'Tool calls',
      output: 'Output tokens',
      outputToday: 'Output today',
      outputWeek: 'Last 7 days',
      billed: 'Billed tokens',
      cacheRate: 'Prompt cache hit',
      avgSeconds: 'Avg. response',
      edited: 'Sessions that edited files',
      artifacts: 'Artifacts',
      requests: 'Model requests',
      seconds: 's',
      trend: 'Last 14 days',
      trendHint: 'output tokens per day',
      projects: 'Projects',
      models: 'Models',
      recent: 'Recent sessions',
      sessionsCount: function (n) { return n + (n === '1' ? ' session' : ' sessions'); },
      project: 'Project',
      lastActive: 'Last active',
      empty: 'Nothing yet',
      justNow: 'just now',
      minutesAgo: function (n) { return n + 'm ago'; },
      hoursAgo: function (n) { return n + 'h ago'; },
      daysAgo: function (n) { return n + 'd ago'; },
      footNote: 'Output tokens are what the model actually generated. Billed tokens sum the usage '
        + 'reported per request, so shared context is counted again on every turn. '
        + 'Cache hit = cached prompt tokens ÷ all prompt tokens.',
      footScan: function (files, ms) { return 'Scanned ' + files + ' session files in ' + ms + ' ms.'; }
    }
  };

  var ctx = {};
  function lang() {
    return String(ctx.locale || navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
  }
  function t(key) {
    var value = STRINGS[lang()][key];
    return typeof value === 'function' ? value.apply(null, [].slice.call(arguments, 1)) : value;
  }

  // ── MCP App 协议 ────────────────────────────────────────
  var nextID = 1;
  var pending = {};

  function request(method, params) {
    var id = nextID++;
    parent.postMessage({ jsonrpc: '2.0', id: id, method: method, params: params || {} }, '*');
    return new Promise(function (resolve, reject) {
      var timer = window.setTimeout(function () {
        if (!pending[id]) return;
        delete pending[id];
        reject(new Error(method + ': timed out'));
      }, 30000);
      pending[id] = { resolve: resolve, reject: reject, timer: timer };
    });
  }

  function notify(method, params) {
    parent.postMessage({ jsonrpc: '2.0', method: method, params: params || {} }, '*');
  }

  window.addEventListener('message', function (event) {
    var message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    // 这个页面是 WKWebView 的顶层文档，`parent === window`：我们自己
    // postMessage 出去的每条请求都会原样回到这个监听器。带 method 的是
    // 请求/通知，绝不是响应——早先没有这道闸，于是 ui/initialize 一发出去
    // 就被自己的回声「解决」成了 undefined，页面永远停在英文标题，点刷新
    // 报 “undefined is not an object (evaluating 'res.contents')”。
    if (typeof message.method === 'string') {
      if (message.method === 'ui/notifications/host-context-changed') {
        ctx = shallowMerge(ctx, (message.params && message.params.willdeep) || {});
        renderChrome();
        load();
      }
      return;
    }
    if (message.id === undefined || message.id === null) return;
    var waiter = pending[message.id];
    if (!waiter) return;
    delete pending[message.id];
    window.clearTimeout(waiter.timer);
    if (message.error) {
      waiter.reject(new Error(String(message.error.message || 'request failed')));
    } else {
      waiter.resolve(message.result);
    }
  });

  function shallowMerge(base, extra) {
    var out = {};
    Object.keys(base || {}).forEach(function (key) { out[key] = base[key]; });
    Object.keys(extra || {}).forEach(function (key) { out[key] = extra[key]; });
    return out;
  }

  // ── 取数 ───────────────────────────────────────────────
  function readStats() {
    return request('resources/read', { uri: 'willdeep-plugin://vitality/stats' }).then(function (result) {
      var entry = result && result.contents && result.contents[0];
      if (!entry || typeof entry.text !== 'string') {
        throw new Error('resources/read returned no contents');
      }
      return JSON.parse(entry.text);
    });
  }

  // ── DOM ───────────────────────────────────────────────
  var $ = function (id) { return document.getElementById(id); };
  var nf = new Intl.NumberFormat();
  var stats = null;
  var loading = false;

  function compact(value) {
    var n = Number(value) || 0;
    if (lang() === 'zh') {
      if (n >= 1e8) return { num: (n / 1e8).toFixed(n >= 1e9 ? 0 : 1), unit: '亿' };
      if (n >= 1e4) return { num: (n / 1e4).toFixed(n >= 1e5 ? 0 : 1), unit: '万' };
    } else {
      if (n >= 1e9) return { num: (n / 1e9).toFixed(1), unit: 'B' };
      if (n >= 1e6) return { num: (n / 1e6).toFixed(1), unit: 'M' };
      if (n >= 1e4) return { num: (n / 1e3).toFixed(0), unit: 'K' };
    }
    return { num: nf.format(n), unit: '' };
  }

  function relative(iso) {
    if (!iso) return '';
    var date = new Date(iso);
    if (isNaN(date.getTime())) return '';
    var minutes = Math.floor((Date.now() - date.getTime()) / 60000);
    if (minutes < 1) return t('justNow');
    if (minutes < 60) return t('minutesAgo', minutes);
    if (minutes < 60 * 24) return t('hoursAgo', Math.floor(minutes / 60));
    return t('daysAgo', Math.floor(minutes / 1440));
  }

  function element(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function renderChrome() {
    document.documentElement.lang = lang() === 'zh' ? 'zh-Hans' : 'en';
    $('title').textContent = t('title');
    $('refresh').textContent = loading ? t('refreshing') : t('refresh');
    $('refresh').disabled = loading;
    $('export').textContent = t('export');
    $('trend-title').firstChild.nodeValue = t('trend');
    $('trend-hint').textContent = '· ' + t('trendHint');
    $('projects-title').textContent = t('projects');
    $('models-title').textContent = t('models');
    $('recent-title').textContent = t('recent');
    $('generated').textContent = stats ? relative(stats.generatedAt) : '';
  }

  function showBanner(message, kind, action) {
    var banner = $('banner');
    banner.className = 'banner' + (kind ? ' ' + kind : '');
    $('banner-text').textContent = message;
    var button = $('banner-action');
    if (action) {
      button.textContent = action.label;
      button.onclick = action.run;
      button.classList.remove('hidden');
    } else {
      button.classList.add('hidden');
      button.onclick = null;
    }
    banner.classList.remove('hidden');
  }

  function hideBanner() { $('banner').classList.add('hidden'); }

  function showState(kind, headline, body, action) {
    var state = $('state');
    state.className = 'state' + (kind ? ' ' + kind : '');
    state.textContent = '';
    state.appendChild(element('div', 'headline', headline));
    if (body) state.appendChild(element('div', null, body));
    if (action) {
      var button = element('button', 'chip', action.label);
      button.type = 'button';
      button.style.marginTop = '12px';
      button.onclick = action.run;
      state.appendChild(button);
    }
    state.classList.remove('hidden');
    $('skeleton').classList.add('hidden');
  }

  function kpi(labelKey, value, sub) {
    var card = element('div', 'card');
    var num = element('div', 'num');
    if (typeof value === 'object' && value !== null) {
      num.appendChild(document.createTextNode(value.num));
      if (value.unit) num.appendChild(element('span', 'unit', value.unit));
    } else {
      num.textContent = String(value);
    }
    card.appendChild(num);
    card.appendChild(element('div', 'lbl', t(labelKey)));
    if (sub) card.appendChild(element('div', 'sub', sub));
    return card;
  }

  function renderKPIs() {
    var grid = $('kpis');
    grid.textContent = '';
    grid.appendChild(kpi('sessions', compact(stats.sessions),
      t('activeSessions') + ' ' + nf.format(stats.activeSessions || 0)));
    grid.appendChild(kpi('messages', compact(stats.messages),
      t('requests') + ' ' + nf.format(stats.requests || 0)));
    grid.appendChild(kpi('toolCalls', compact(stats.toolCalls)));
    grid.appendChild(kpi('output', compact(stats.outputTokens),
      t('outputToday') + ' ' + compactText(stats.outputToday) + ' · ' + t('outputWeek') + ' ' + compactText(stats.outputWeek)));
    grid.appendChild(kpi('billed', compact(stats.billedTokens)));
    grid.appendChild(kpi('cacheRate', { num: (Number(stats.cacheRate || 0) * 100).toFixed(1), unit: '%' }));
    grid.appendChild(kpi('avgSeconds', { num: Number(stats.averageSeconds || 0).toFixed(1), unit: t('seconds') }));
    grid.appendChild(kpi('edited', compact(stats.editedSessions),
      t('artifacts') + ' ' + nf.format(stats.artifacts || 0)));
  }

  function compactText(value) {
    var parts = compact(value);
    return parts.num + (parts.unit ? parts.unit : '');
  }

  function renderTrend() {
    var wrap = $('trend');
    wrap.textContent = '';
    var days = stats.trend || [];
    var max = 0;
    days.forEach(function (day) { max = Math.max(max, Number(day.output) || 0); });
    days.forEach(function (day, index) {
      var column = element('div', 'col' + (index === days.length - 1 ? ' today' : ''));
      var height = max > 0 ? Math.max(2, Math.round((Number(day.output) || 0) / max * 100)) : 2;
      var bar = element('div', 'bar');
      bar.style.height = height + '%';
      column.title = day.date + ' · ' + t('output') + ' ' + nf.format(day.output || 0)
        + ' · ' + t('messages') + ' ' + nf.format(day.messages || 0);
      column.appendChild(bar);
      column.appendChild(element('div', 'day', day.weekday || day.date.slice(5)));
      wrap.appendChild(column);
    });
  }

  function renderProjects() {
    var wrap = $('projects-wrap');
    wrap.textContent = '';
    var rows = stats.projects || [];
    if (!rows.length) {
      wrap.appendChild(element('div', 'muted', t('empty')));
      return;
    }
    var table = document.createElement('table');
    var head = document.createElement('tr');
    [t('project'), '', t('sessions'), t('messages'), t('output'), t('lastActive')].forEach(function (label, index) {
      var th = element('th', index >= 2 && index <= 4 ? 'num' : null, label);
      if (index === 1) th.style.width = '22%';
      head.appendChild(th);
    });
    var thead = document.createElement('thead');
    thead.appendChild(head);
    table.appendChild(thead);

    var body = document.createElement('tbody');
    rows.forEach(function (project) {
      var tr = document.createElement('tr');
      var name = element('td', 'name', project.name);
      if (project.path) name.title = project.path;
      tr.appendChild(name);

      var meterCell = document.createElement('td');
      var meter = element('div', 'meter');
      var fill = document.createElement('span');
      fill.style.width = Math.round(Math.max(0, Math.min(1, project.share || 0)) * 100) + '%';
      meter.appendChild(fill);
      meterCell.appendChild(meter);
      tr.appendChild(meterCell);

      tr.appendChild(element('td', 'num', nf.format(project.sessions || 0)));
      tr.appendChild(element('td', 'num', nf.format(project.messages || 0)));
      tr.appendChild(element('td', 'num', compactText(project.output)));
      tr.appendChild(element('td', 'muted', relative(project.updatedAt)));
      body.appendChild(tr);
    });
    table.appendChild(body);
    wrap.appendChild(table);
  }

  function renderModels() {
    var wrap = $('models-wrap');
    wrap.textContent = '';
    var rows = stats.models || [];
    if (!rows.length) {
      wrap.appendChild(element('div', 'muted', t('empty')));
      return;
    }
    var table = document.createElement('table');
    var body = document.createElement('tbody');
    rows.forEach(function (model) {
      var tr = document.createElement('tr');
      tr.appendChild(element('td', 'name', model.name));

      var meterCell = document.createElement('td');
      meterCell.style.width = '38%';
      var meter = element('div', 'meter');
      var fill = document.createElement('span');
      fill.style.width = Math.round(Math.max(0, Math.min(1, model.share || 0)) * 100) + '%';
      meter.appendChild(fill);
      meterCell.appendChild(meter);
      tr.appendChild(meterCell);

      tr.appendChild(element('td', 'num', t('sessionsCount', nf.format(model.sessions || 0))));
      tr.appendChild(element('td', 'num', compactText(model.output)));
      body.appendChild(tr);
    });
    table.appendChild(body);
    wrap.appendChild(table);
  }

  function renderRecent() {
    var wrap = $('recent');
    wrap.textContent = '';
    var rows = stats.recent || [];
    if (!rows.length) {
      wrap.appendChild(element('div', 'muted', t('empty')));
      return;
    }
    rows.forEach(function (session) {
      var row = element('div', 'row');
      row.appendChild(element('span', 'title', session.title));
      if (session.project) row.appendChild(element('span', 'tag', session.project));
      if (session.model) row.appendChild(element('span', 'tag', session.model));
      row.appendChild(element('span', 'spacer'));
      row.appendChild(element('span', 'stat',
        nf.format(session.messages || 0) + ' · ' + compactText(session.output)));
      row.appendChild(element('span', 'stat', relative(session.updatedAt)));
      wrap.appendChild(row);
    });
  }

  function renderFooter() {
    var foot = $('foot');
    foot.textContent = '';
    foot.appendChild(element('div', null, t('footNote')));
    var scan = element('div', null, t('footScan', stats.scannedFiles || 0, stats.scanMilliseconds || 0) + ' ');
    var code = element('code', null, stats.source || '');
    scan.appendChild(code);
    foot.appendChild(scan);
  }

  function render() {
    renderChrome();
    if (!stats) return;
    $('skeleton').classList.add('hidden');
    if (!stats.sessions) {
      $('main').classList.add('hidden');
      showState('', t('emptyTitle'), t('emptyBody'), { label: t('refresh'), run: load });
      return;
    }
    $('state').classList.add('hidden');
    $('main').classList.remove('hidden');
    if (stats.demo) {
      showBanner(t('demo'), null, null);
    } else {
      hideBanner();
    }
    renderKPIs();
    renderTrend();
    renderProjects();
    renderModels();
    renderRecent();
    renderFooter();
  }

  var inFlight = null;
  function load() {
    if (inFlight) return inFlight;
    loading = true;
    renderChrome();
    inFlight = readStats()
      .then(function (payload) {
        stats = payload;
        loading = false;
        render();
      })
      .catch(function (error) {
        loading = false;
        var message = (error && error.message) ? error.message : String(error);
        if (stats) {
          // 已经有数据就别把页面清空：顶部挂条错误提示，旧数字继续看。
          renderChrome();
          showBanner(t('errorTitle') + '：' + message, 'error', { label: t('retry'), run: load });
        } else {
          showState('error', t('errorTitle'), message, { label: t('retry'), run: load });
        }
      })
      .then(function () { inFlight = null; });
    return inFlight;
  }

  function copyText(value) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(value).then(function () { return true; }, legacy);
    }
    return Promise.resolve(legacy());

    function legacy() {
      try {
        var area = document.createElement('textarea');
        area.value = value;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(area);
        return ok;
      } catch (error) {
        return false;
      }
    }
  }

  $('refresh').addEventListener('click', function () { load(); });
  $('export').addEventListener('click', function () {
    var button = $('export');
    button.disabled = true;
    button.textContent = t('exporting');
    request('tools/call', { name: 'vitality.export', arguments: {} })
      .then(function (result) {
        var entry = result && result.content && result.content[0];
        var markdown = entry && entry.text;
        if (!markdown) throw new Error('empty export');
        return copyText(markdown);
      })
      .then(function (ok) {
        button.textContent = ok ? t('exported') : t('exportFailed');
      })
      .catch(function () {
        button.textContent = t('exportFailed');
      })
      .then(function () {
        window.setTimeout(function () {
          button.disabled = false;
          button.textContent = t('export');
        }, 1600);
      });
  });

  // 握手：先拿 hostContext，再声明 initialized（宿主在这之后才受理
  // resources/read 与 tools/call），最后才去取数。顺序反了会被宿主
  // 以 -32002 "MCP App is not initialized" 顶回来。
  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appCapabilities: {},
    clientInfo: { name: 'willdeep-session-vitality', version: '2.0.0' }
  }).then(function (result) {
    ctx = (result && result.hostContext && result.hostContext.willdeep) || {};
    notify('ui/notifications/initialized', {});
    renderChrome();
    return load();
  }).catch(function (error) {
    showState('error', t('errorTitle'), (error && error.message) ? error.message : String(error),
      { label: t('retry'), run: function () { window.location.reload(); } });
  });

  renderChrome();
})();
</script>
</body>
</html>
