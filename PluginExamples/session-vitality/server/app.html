<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Vitality</title>
<style>
/*
 * 会话体检中心（MCP App 页面）。
 *
 * 配色一律从宿主注入的 --willdeep-* 变量派生：这个页面跑在 WKWebView 里，
 * prefers-color-scheme 不一定跟 App 的深浅色一致，宿主变量才是权威。
 * 布局只用 %、flex 与 grid —— 插件页宽度由宿主分栏决定，vw 会算错。
 */
:root {
  --fg: var(--willdeep-fg, #1d1d1f);
  --muted: var(--willdeep-secondary, #6e6e73);
  --surface: color-mix(in srgb, var(--fg) 5%, transparent);
  --surface-strong: color-mix(in srgb, var(--fg) 9%, transparent);
  --surface-soft: color-mix(in srgb, var(--fg) 2.5%, transparent);
  --border: color-mix(in srgb, var(--fg) 15%, transparent);
  --border-strong: color-mix(in srgb, var(--fg) 32%, transparent);
  --chart-bar: color-mix(in srgb, var(--fg) 28%, transparent);
  --chart-line: color-mix(in srgb, var(--fg) 78%, transparent);
  --warn: #d99b1c;
  --danger: #e5484d;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  color: var(--fg);
  padding: 18px 20px 28px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
.hidden { display: none !important; }

header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
h1 { font-size: 17px; font-weight: 650; letter-spacing: .2px; }
.subtitle { color: var(--muted); font-size: 11.5px; }
.toolbar { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.chip {
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 4px 11px;
  font-size: 12px;
  white-space: nowrap;
}
.chip:hover { border-color: var(--border-strong); }
.chip:disabled { opacity: .5; cursor: default; }

.banner {
  border: 1px solid var(--border);
  border-left: 3px solid var(--warn);
  border-radius: 8px;
  background: var(--surface);
  padding: 8px 12px;
  font-size: 12px;
  margin-bottom: 14px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.banner.error { border-left-color: var(--danger); color: var(--danger); }
.banner .spacer { margin-left: auto; }

main { display: flex; flex-direction: column; gap: 14px; }
.panel {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-soft);
  padding: 14px;
  min-width: 0;
}
.panel-heading {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 7px 12px;
  margin-bottom: 12px;
}
.panel-heading h2 {
  color: var(--fg);
  font-size: 13px;
  font-weight: 650;
  letter-spacing: .1px;
}
.panel-heading .hint { color: var(--muted); font-size: 11px; }
.panel-heading .spacer { margin-left: auto; }

/* ── 主指标 ───────────────────────────────────────────── */
.hero-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
  gap: 10px;
}
.metric-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 13px 15px 12px;
  min-width: 0;
}
.metric-card .num {
  font-size: 25px;
  font-weight: 670;
  font-variant-numeric: tabular-nums;
  line-height: 1.14;
  letter-spacing: -.35px;
}
.metric-card .num .unit { font-size: 12px; font-weight: 520; color: var(--muted); margin-left: 3px; }
.metric-card .lbl { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.metric-card .sub {
  color: var(--muted);
  font-size: 11px;
  margin-top: 9px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── 趋势与工作画像 ───────────────────────────────────── */
.analytics-grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(280px, .82fr);
  gap: 10px;
  align-items: stretch;
}
.legend { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 10.5px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.legend .bar { height: 7px; background: var(--chart-bar); }
.legend .line { background: var(--chart-line); }
.chart-stage { position: relative; min-height: 230px; }
.chart-stage canvas { display: block; width: 100%; height: 230px; }
.chart-tooltip {
  position: absolute;
  top: 12px;
  transform: translateX(-50%);
  max-width: min(260px, 76%);
  padding: 6px 9px;
  border: 1px solid var(--border-strong);
  border-radius: 7px;
  background: color-mix(in srgb, var(--willdeep-bg, #fff) 94%, var(--fg));
  color: var(--fg);
  box-shadow: 0 5px 18px rgba(0, 0, 0, .12);
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
  white-space: nowrap;
}
.profile-rates { display: flex; flex-direction: column; gap: 12px; }
.rate-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; }
.rate-line .label { color: var(--muted); font-size: 11px; }
.rate-line .value { font-size: 11.5px; font-weight: 620; font-variant-numeric: tabular-nums; }
.rate-line .meter { grid-column: 1 / -1; }
.profile-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.profile-stat { border-radius: 8px; background: var(--surface); padding: 9px 10px; min-width: 0; }
.profile-stat .value { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
.profile-stat .label { color: var(--muted); font-size: 10.5px; margin-top: 2px; }

/* ── 项目与模型 ───────────────────────────────────────── */
.rank-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.45fr) minmax(300px, .85fr);
  gap: 10px;
  align-items: start;
}
.table-scroll { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; }
th {
  font-size: 11px; color: var(--muted); text-align: left;
  padding: 4px 6px; border-bottom: 1px solid var(--border); font-weight: 500;
}
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
td { padding: 7px 6px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface); }
td.name { font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.muted, .muted { color: var(--muted); }
.meter { height: 5px; background: var(--surface-strong); border-radius: 3px; overflow: hidden; min-width: 60px; }
.meter > span { display: block; height: 100%; background: var(--chart-line); border-radius: 3px; }
.name-meter { margin-top: 5px; max-width: 180px; }
.model-list { display: flex; flex-direction: column; gap: 8px; }
.model-row { border-radius: 8px; background: var(--surface); padding: 9px 10px; }
.model-row .top { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.model-row .name { font-size: 12px; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-row .provider { color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-row .share { margin-left: auto; color: var(--muted); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.model-row .meter { margin-top: 7px; }
.model-row .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 7px; color: var(--muted); font-size: 10.5px; }

/* ── 最近会话 ─────────────────────────────────────────── */
.recent {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
  gap: 8px;
  align-items: start;
}
.recent .row {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  padding: 10px 11px;
  min-width: 0;
}
.recent .title { font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent .tags { display: flex; gap: 5px; margin-top: 7px; min-width: 0; }
.recent .tag {
  font-size: 11px; color: var(--muted);
  background: var(--surface-strong); border-radius: 4px; padding: 1px 6px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.recent .stats { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
.recent .stat { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.recent .time { margin-left: auto; }

/* ── 状态位 ──────────────────────────────────────────── */
.state { padding: 40px 12px; text-align: center; color: var(--muted); }
.state .headline { color: var(--fg); font-size: 14px; margin-bottom: 6px; }
.state.error .headline { color: var(--danger); }
.skeleton { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.skeleton div { height: 66px; border-radius: var(--radius); background: var(--surface); animation: pulse 1.4s ease-in-out infinite; }
.skeleton div:nth-child(2) { animation-delay: .15s; }
.skeleton div:nth-child(3) { animation-delay: .3s; }
.skeleton div:nth-child(4) { animation-delay: .45s; }
@keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: .9; } }
footer { margin-top: 24px; font-size: 11px; color: var(--muted); line-height: 1.7; }
footer code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--surface-strong); border-radius: 4px; padding: 1px 5px;
}
@media (max-width: 900px) {
  .analytics-grid, .rank-grid { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .projects-table .optional { display: none; }
}
@media (max-width: 560px) {
  body { padding-left: 14px; padding-right: 14px; }
  .toolbar { width: 100%; margin-left: 0; }
  .toolbar .chip { flex: 1; }
  .panel { padding: 12px; }
  .chart-stage, .chart-stage canvas { height: 205px; min-height: 205px; }
}
@media (prefers-reduced-motion: reduce) { .skeleton div { animation: none; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Session Vitality</h1>
  <span class="subtitle" id="generated"></span>
  <div class="toolbar">
    <button class="chip" id="export" type="button"></button>
    <button class="chip" id="refresh" type="button"></button>
  </div>
</header>

<div class="banner hidden" id="banner">
  <span id="banner-text"></span>
  <span class="spacer"></span>
  <button class="chip hidden" id="banner-action" type="button"></button>
</div>

<div class="skeleton" id="skeleton"><div></div><div></div><div></div><div></div></div>
<div class="state hidden" id="state"></div>
<main id="main" class="hidden">
  <div class="hero-grid" id="kpis"></div>

  <div class="analytics-grid">
    <section class="panel">
      <div class="panel-heading">
        <h2 id="trend-title">Trend</h2>
        <span class="hint" id="trend-hint"></span>
        <span class="spacer"></span>
        <div class="legend" aria-hidden="true">
          <span><i class="bar"></i><b id="trend-output-legend"></b></span>
          <span><i class="line"></i><b id="trend-request-legend"></b></span>
        </div>
      </div>
      <div class="chart-stage">
        <canvas id="trend" role="img"></canvas>
        <div class="chart-tooltip hidden" id="trend-tooltip"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <h2 id="profile-title">Work profile</h2>
      </div>
      <div class="profile-rates" id="profile-rates"></div>
      <div class="profile-grid" id="profile-stats"></div>
    </section>
  </div>

  <div class="rank-grid">
    <section class="panel">
      <div class="panel-heading"><h2 id="projects-title">Projects</h2></div>
      <div id="projects-wrap"></div>
    </section>
    <section class="panel">
      <div class="panel-heading"><h2 id="models-title">Models</h2></div>
      <div id="models-wrap"></div>
    </section>
  </div>

  <section class="panel">
    <div class="panel-heading"><h2 id="recent-title">Recent sessions</h2></div>
    <div class="recent" id="recent"></div>
  </section>

  <footer id="foot"></footer>
</main>

<script>
(function () {
  'use strict';

  // ── i18n ───────────────────────────────────────────────
  var STRINGS = {
    zh: {
      title: '会话体检中心',
      refresh: '刷新',
      refreshing: '刷新中…',
      export: '导出 Markdown',
      exporting: '导出中…',
      exported: '已复制到剪贴板',
      exportFailed: '导出失败',
      demo: '演示数据 —— 没找到真实的会话存储，下面的数字都是示例。',
      errorTitle: '读不到会话统计',
      retry: '重试',
      emptyTitle: '还没有会话数据',
      emptyBody: '在 WillDeep 里聊上几轮，这里就会有东西看了。',
      sessions: '会话数',
      activeSessions: '有对话的会话',
      messages: '消息数',
      toolCalls: '工具调用',
      output: '输出 Token',
      outputToday: '今日输出',
      outputWeek: '近 7 天',
      billed: '计费 Token',
      cacheRate: '缓存命中',
      avgSeconds: '平均响应',
      edited: '改过文件的会话',
      artifacts: '产物文件',
      requests: '模型请求',
      seconds: '秒',
      trend: '近 14 天',
      trendHint: '输出量与请求密度',
      trendOutput: '输出 Token',
      trendRequests: '模型请求',
      trendAccessible: function (output, requests) { return '近 14 天输出 ' + output + '，模型请求 ' + requests; },
      dayDetail: function (date, output, requests, messages, billed) {
        return date + ' · 输出 ' + output + ' · 请求 ' + requests + ' · 消息 ' + messages + ' · 计费 ' + billed;
      },
      profile: '工作画像',
      activeRate: '有效会话占比',
      editRate: '文件改动会话占比',
      activeDays: '近 14 天活跃',
      daysOf: function (active, total) { return active + ' / ' + total + ' 天'; },
      messagesPerSession: '每个有效会话消息',
      outputPerRequest: '每次请求输出',
      toolsPerSession: '每个有效会话工具调用',
      projects: '项目',
      models: '模型',
      recent: '最近会话',
      sessionsCount: function (n) { return n + ' 个会话'; },
      project: '项目',
      lastActive: '最后活跃',
      fileImpact: '改动 / 产物',
      fileImpactValue: function (edited, artifacts) { return edited + ' / ' + artifacts; },
      percentValue: function (value) { return value + '%'; },
      messageCount: function (value) { return value + ' 条消息'; },
      requestCount: function (value) { return value + ' 次请求'; },
      empty: '暂无数据',
      justNow: '刚刚',
      minutesAgo: function (n) { return n + ' 分钟前'; },
      hoursAgo: function (n) { return n + ' 小时前'; },
      daysAgo: function (n) { return n + ' 天前'; },
      footNote: '输出 Token 是模型真正生成的量；计费 Token 按每次请求上报的用量累加，'
        + '同一段上下文在多轮里会被重复计费，所以它远大于输出。缓存命中 = 命中缓存的 prompt ÷ 全部 prompt。',
      footScan: function (files, ms) { return '扫描 ' + files + ' 个会话文件，用时 ' + ms + ' ms。'; }
    },
    en: {
      title: 'Session Vitality',
      refresh: 'Refresh',
      refreshing: 'Refreshing…',
      export: 'Export Markdown',
      exporting: 'Exporting…',
      exported: 'Copied to clipboard',
      exportFailed: 'Export failed',
      demo: 'Demo data — no real session store was found, every number below is a sample.',
      errorTitle: 'Could not read session stats',
      retry: 'Retry',
      emptyTitle: 'No session data yet',
      emptyBody: 'Chat a few turns in WillDeep and this page fills up.',
      sessions: 'Sessions',
      activeSessions: 'Sessions with messages',
      messages: 'Messages',
      toolCalls: 'Tool calls',
      output: 'Output tokens',
      outputToday: 'Output today',
      outputWeek: 'Last 7 days',
      billed: 'Billed tokens',
      cacheRate: 'Prompt cache hit',
      avgSeconds: 'Avg. response',
      edited: 'Sessions that edited files',
      artifacts: 'Artifacts',
      requests: 'Model requests',
      seconds: 's',
      trend: 'Last 14 days',
      trendHint: 'output volume and request density',
      trendOutput: 'Output tokens',
      trendRequests: 'Model requests',
      trendAccessible: function (output, requests) { return output + ' output tokens and ' + requests + ' model requests over 14 days'; },
      dayDetail: function (date, output, requests, messages, billed) {
        return date + ' · ' + output + ' output · ' + requests + ' requests · ' + messages + ' messages · ' + billed + ' billed';
      },
      profile: 'Work profile',
      activeRate: 'Sessions with messages',
      editRate: 'Sessions that edited files',
      activeDays: 'Active in the last 14 days',
      daysOf: function (active, total) { return active + ' of ' + total + ' days'; },
      messagesPerSession: 'Messages per active session',
      outputPerRequest: 'Output per request',
      toolsPerSession: 'Tool calls per active session',
      projects: 'Projects',
      models: 'Models',
      recent: 'Recent sessions',
      sessionsCount: function (n) { return n + (n === '1' ? ' session' : ' sessions'); },
      project: 'Project',
      lastActive: 'Last active',
      fileImpact: 'Edited / artifacts',
      fileImpactValue: function (edited, artifacts) { return edited + ' / ' + artifacts; },
      percentValue: function (value) { return value + '%'; },
      messageCount: function (value) { return value + ' messages'; },
      requestCount: function (value) { return value + ' requests'; },
      empty: 'Nothing yet',
      justNow: 'just now',
      minutesAgo: function (n) { return n + 'm ago'; },
      hoursAgo: function (n) { return n + 'h ago'; },
      daysAgo: function (n) { return n + 'd ago'; },
      footNote: 'Output tokens are what the model actually generated. Billed tokens sum the usage '
        + 'reported per request, so shared context is counted again on every turn. '
        + 'Cache hit = cached prompt tokens ÷ all prompt tokens.',
      footScan: function (files, ms) { return 'Scanned ' + files + ' session files in ' + ms + ' ms.'; }
    }
  };

  var ctx = {};
  function lang() {
    return String(ctx.locale || navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
  }
  function t(key) {
    var value = STRINGS[lang()][key];
    return typeof value === 'function' ? value.apply(null, [].slice.call(arguments, 1)) : value;
  }

  // ── MCP App 协议 ────────────────────────────────────────
  var nextID = 1;
  var pending = {};

  function request(method, params) {
    var id = nextID++;
    parent.postMessage({ jsonrpc: '2.0', id: id, method: method, params: params || {} }, '*');
    return new Promise(function (resolve, reject) {
      var timer = window.setTimeout(function () {
        if (!pending[id]) return;
        delete pending[id];
        reject(new Error(method + ': timed out'));
      }, 30000);
      pending[id] = { resolve: resolve, reject: reject, timer: timer };
    });
  }

  function notify(method, params) {
    parent.postMessage({ jsonrpc: '2.0', method: method, params: params || {} }, '*');
  }

  window.addEventListener('message', function (event) {
    var message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    // 这个页面是 WKWebView 的顶层文档，`parent === window`：我们自己
    // postMessage 出去的每条请求都会原样回到这个监听器。带 method 的是
    // 请求/通知，绝不是响应——早先没有这道闸，于是 ui/initialize 一发出去
    // 就被自己的回声「解决」成了 undefined，页面永远停在英文标题，点刷新
    // 报 “undefined is not an object (evaluating 'res.contents')”。
    if (typeof message.method === 'string') {
      if (message.method === 'ui/notifications/host-context-changed') {
        ctx = shallowMerge(ctx, (message.params && message.params.willdeep) || {});
        renderChrome();
        load();
      }
      return;
    }
    if (message.id === undefined || message.id === null) return;
    var waiter = pending[message.id];
    if (!waiter) return;
    delete pending[message.id];
    window.clearTimeout(waiter.timer);
    if (message.error) {
      waiter.reject(new Error(String(message.error.message || 'request failed')));
    } else {
      waiter.resolve(message.result);
    }
  });

  function shallowMerge(base, extra) {
    var out = {};
    Object.keys(base || {}).forEach(function (key) { out[key] = base[key]; });
    Object.keys(extra || {}).forEach(function (key) { out[key] = extra[key]; });
    return out;
  }

  // ── 取数 ───────────────────────────────────────────────
  function readStats() {
    return request('resources/read', { uri: 'willdeep-plugin://vitality/stats' }).then(function (result) {
      var entry = result && result.contents && result.contents[0];
      if (!entry || typeof entry.text !== 'string') {
        throw new Error('resources/read returned no contents');
      }
      return JSON.parse(entry.text);
    });
  }

  // ── DOM ───────────────────────────────────────────────
  var $ = function (id) { return document.getElementById(id); };
  var nf = new Intl.NumberFormat();
  var stats = null;
  var loading = false;

  function compact(value) {
    var n = Number(value) || 0;
    if (lang() === 'zh') {
      if (n >= 1e8) return { num: (n / 1e8).toFixed(n >= 1e9 ? 0 : 1), unit: '亿' };
      if (n >= 1e4) return { num: (n / 1e4).toFixed(n >= 1e5 ? 0 : 1), unit: '万' };
    } else {
      if (n >= 1e9) return { num: (n / 1e9).toFixed(1), unit: 'B' };
      if (n >= 1e6) return { num: (n / 1e6).toFixed(1), unit: 'M' };
      if (n >= 1e4) return { num: (n / 1e3).toFixed(0), unit: 'K' };
    }
    return { num: nf.format(n), unit: '' };
  }

  function relative(iso) {
    if (!iso) return '';
    var date = new Date(iso);
    if (isNaN(date.getTime())) return '';
    var minutes = Math.floor((Date.now() - date.getTime()) / 60000);
    if (minutes < 1) return t('justNow');
    if (minutes < 60) return t('minutesAgo', minutes);
    if (minutes < 60 * 24) return t('hoursAgo', Math.floor(minutes / 60));
    return t('daysAgo', Math.floor(minutes / 1440));
  }

  function element(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function renderChrome() {
    document.documentElement.lang = lang() === 'zh' ? 'zh-Hans' : 'en';
    $('title').textContent = t('title');
    $('refresh').textContent = loading ? t('refreshing') : t('refresh');
    $('refresh').disabled = loading;
    $('export').textContent = t('export');
    $('trend-title').textContent = t('trend');
    $('trend-hint').textContent = t('trendHint');
    $('trend-output-legend').textContent = t('trendOutput');
    $('trend-request-legend').textContent = t('trendRequests');
    $('profile-title').textContent = t('profile');
    $('projects-title').textContent = t('projects');
    $('models-title').textContent = t('models');
    $('recent-title').textContent = t('recent');
    $('generated').textContent = stats ? relative(stats.generatedAt) : '';
  }

  function showBanner(message, kind, action) {
    var banner = $('banner');
    banner.className = 'banner' + (kind ? ' ' + kind : '');
    $('banner-text').textContent = message;
    var button = $('banner-action');
    if (action) {
      button.textContent = action.label;
      button.onclick = action.run;
      button.classList.remove('hidden');
    } else {
      button.classList.add('hidden');
      button.onclick = null;
    }
    banner.classList.remove('hidden');
  }

  function hideBanner() { $('banner').classList.add('hidden'); }

  function showState(kind, headline, body, action) {
    var state = $('state');
    state.className = 'state' + (kind ? ' ' + kind : '');
    state.textContent = '';
    state.appendChild(element('div', 'headline', headline));
    if (body) state.appendChild(element('div', null, body));
    if (action) {
      var button = element('button', 'chip', action.label);
      button.type = 'button';
      button.style.marginTop = '12px';
      button.onclick = action.run;
      state.appendChild(button);
    }
    state.classList.remove('hidden');
    $('skeleton').classList.add('hidden');
  }

  function kpi(labelKey, value, sub) {
    var card = element('div', 'metric-card');
    var num = element('div', 'num');
    if (typeof value === 'object' && value !== null) {
      num.appendChild(document.createTextNode(value.num));
      if (value.unit) num.appendChild(element('span', 'unit', value.unit));
    } else {
      num.textContent = String(value);
    }
    card.appendChild(num);
    card.appendChild(element('div', 'lbl', t(labelKey)));
    if (sub) card.appendChild(element('div', 'sub', sub));
    return card;
  }

  function renderKPIs() {
    var grid = $('kpis');
    grid.textContent = '';
    grid.appendChild(kpi('sessions', compact(stats.sessions),
      t('activeSessions') + ' ' + nf.format(stats.activeSessions || 0)
        + ' · ' + percent(stats.activeSessions, stats.sessions)));
    grid.appendChild(kpi('messages', compact(stats.messages),
      t('requests') + ' ' + nf.format(stats.requests || 0)
        + ' · ' + t('toolCalls') + ' ' + nf.format(stats.toolCalls || 0)));
    grid.appendChild(kpi('output', compact(stats.outputTokens),
      t('outputToday') + ' ' + compactText(stats.outputToday) + ' · ' + t('outputWeek') + ' ' + compactText(stats.outputWeek)));
    grid.appendChild(kpi('cacheRate', { num: (Number(stats.cacheRate || 0) * 100).toFixed(1), unit: '%' },
      t('avgSeconds') + ' ' + Number(stats.averageSeconds || 0).toFixed(1) + t('seconds')
        + ' · ' + t('billed') + ' ' + compactText(stats.billedTokens)));
  }

  function compactText(value) {
    var parts = compact(value);
    return parts.num + (parts.unit ? parts.unit : '');
  }

  function percent(part, whole) {
    var denominator = Number(whole) || 0;
    var value = denominator > 0 ? (Number(part) || 0) / denominator * 100 : 0;
    return t('percentValue', value.toFixed(1));
  }

  function decimal(value) {
    var number = Number(value) || 0;
    return number >= 100 ? nf.format(Math.round(number)) : number.toFixed(1);
  }

  var trendDays = [];
  var trendGeometry = null;
  var trendHoverIndex = null;
  var trendFrame = null;

  function renderTrend() {
    trendDays = stats.trend || [];
    trendHoverIndex = null;
    $('trend-tooltip').classList.add('hidden');
    var output = trendDays.reduce(function (sum, day) { return sum + (Number(day.output) || 0); }, 0);
    var requests = trendDays.reduce(function (sum, day) { return sum + (Number(day.requests) || 0); }, 0);
    $('trend').setAttribute('aria-label', t('trendAccessible', nf.format(output), nf.format(requests)));
    scheduleTrendDraw();
  }

  function scheduleTrendDraw() {
    if (trendFrame !== null) window.cancelAnimationFrame(trendFrame);
    trendFrame = window.requestAnimationFrame(function () {
      trendFrame = null;
      drawTrend();
    });
  }

  function canvasColor(name, fallback) {
    var value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return value || fallback;
  }

  function drawTrend() {
    var canvas = $('trend');
    if (!canvas || !trendDays.length) return;
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 40 || rect.height < 40) return;
    var scale = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(rect.width * scale);
    canvas.height = Math.round(rect.height * scale);
    var context = canvas.getContext('2d');
    context.setTransform(scale, 0, 0, scale, 0, 0);
    context.clearRect(0, 0, rect.width, rect.height);

    var left = rect.width < 460 ? 35 : 44;
    var right = 14;
    var top = 14;
    var bottom = 29;
    var width = Math.max(1, rect.width - left - right);
    var height = Math.max(1, rect.height - top - bottom);
    var slot = width / trendDays.length;
    var barWidth = Math.max(5, Math.min(28, slot * .58));
    var maxOutput = trendDays.reduce(function (max, day) { return Math.max(max, Number(day.output) || 0); }, 0) || 1;
    var maxRequests = trendDays.reduce(function (max, day) { return Math.max(max, Number(day.requests) || 0); }, 0) || 1;
    var border = canvasColor('--border', 'rgba(120,120,120,.18)');
    var muted = canvasColor('--muted', '#6e6e73');
    var barColor = canvasColor('--chart-bar', 'rgba(90,90,90,.28)');
    var lineColor = canvasColor('--chart-line', 'rgba(30,30,30,.78)');
    var foreground = canvasColor('--fg', '#1d1d1f');
    var highlight = canvasColor('--surface-strong', 'rgba(90,90,90,.09)');

    context.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
    context.textBaseline = 'middle';
    for (var grid = 0; grid <= 3; grid++) {
      var y = top + height * grid / 3;
      context.strokeStyle = border;
      context.lineWidth = 1;
      context.beginPath();
      context.moveTo(left, Math.round(y) + .5);
      context.lineTo(left + width, Math.round(y) + .5);
      context.stroke();
      context.fillStyle = muted;
      context.textAlign = 'right';
      context.fillText(compactText(maxOutput * (1 - grid / 3)), left - 7, y);
    }

    if (trendHoverIndex !== null) {
      var hoverX = left + slot * trendHoverIndex;
      context.fillStyle = highlight;
      context.fillRect(hoverX, top, slot, height);
    }

    trendDays.forEach(function (day, index) {
      var x = left + slot * index + (slot - barWidth) / 2;
      var barHeight = Math.max(2, (Number(day.output) || 0) / maxOutput * height);
      context.fillStyle = index === trendDays.length - 1 ? foreground : barColor;
      context.fillRect(x, top + height - barHeight, barWidth, barHeight);
    });

    context.strokeStyle = lineColor;
    context.fillStyle = lineColor;
    context.lineWidth = 1.7;
    context.lineJoin = 'round';
    context.lineCap = 'round';
    context.beginPath();
    trendDays.forEach(function (day, index) {
      var x = left + slot * (index + .5);
      var y = top + height - (Number(day.requests) || 0) / maxRequests * height;
      if (index === 0) context.moveTo(x, y); else context.lineTo(x, y);
    });
    context.stroke();
    trendDays.forEach(function (day, index) {
      var x = left + slot * (index + .5);
      var y = top + height - (Number(day.requests) || 0) / maxRequests * height;
      context.beginPath();
      context.arc(x, y, index === trendDays.length - 1 ? 2.8 : 2.1, 0, Math.PI * 2);
      context.fill();
    });

    var labelCount = rect.width >= 720 ? 7 : 4;
    var labelStep = Math.max(1, Math.ceil(trendDays.length / labelCount));
    context.fillStyle = muted;
    context.textAlign = 'center';
    trendDays.forEach(function (day, index) {
      if (index % labelStep !== 0 && index !== trendDays.length - 1) return;
      context.fillText(dayLabel(day.date), left + slot * (index + .5), rect.height - 10);
    });
    trendGeometry = { left: left, width: width, slot: slot, canvasWidth: rect.width };
  }

  function dayLabel(iso) {
    var date = new Date(String(iso) + 'T12:00:00');
    if (isNaN(date.getTime())) return String(iso).slice(5);
    return date.toLocaleDateString([], { month: 'numeric', day: 'numeric' });
  }

  function fullDayLabel(iso) {
    var date = new Date(String(iso) + 'T12:00:00');
    if (isNaN(date.getTime())) return String(iso);
    return date.toLocaleDateString([], { month: 'short', day: 'numeric', weekday: 'short' });
  }

  function renderProfile() {
    var rates = $('profile-rates');
    var cards = $('profile-stats');
    rates.textContent = '';
    cards.textContent = '';
    var active = Number(stats.activeSessions) || 0;
    var sessions = Number(stats.sessions) || 0;
    var edited = Number(stats.editedSessions) || 0;
    rates.appendChild(profileRate('activeRate', active, sessions));
    rates.appendChild(profileRate('editRate', edited, active));

    var days = stats.trend || [];
    var activeDays = days.filter(function (day) { return Number(day.messages) > 0; }).length;
    cards.appendChild(profileStat(t('daysOf', activeDays, days.length), t('activeDays')));
    cards.appendChild(profileStat(decimal((Number(stats.messages) || 0) / Math.max(1, active)), t('messagesPerSession')));
    cards.appendChild(profileStat(compactText(Math.round((Number(stats.outputTokens) || 0) / Math.max(1, Number(stats.requests) || 0))), t('outputPerRequest')));
    cards.appendChild(profileStat(decimal((Number(stats.toolCalls) || 0) / Math.max(1, active)), t('toolsPerSession')));
  }

  function profileRate(labelKey, value, total) {
    var ratio = total > 0 ? Math.max(0, Math.min(1, value / total)) : 0;
    var row = element('div', 'rate-line');
    row.appendChild(element('span', 'label', t(labelKey)));
    row.appendChild(element('span', 'value', t('percentValue', (ratio * 100).toFixed(1))));
    var meter = element('div', 'meter');
    var fill = document.createElement('span');
    fill.style.width = Math.round(ratio * 100) + '%';
    meter.appendChild(fill);
    row.appendChild(meter);
    return row;
  }

  function profileStat(value, label) {
    var card = element('div', 'profile-stat');
    card.appendChild(element('div', 'value', value));
    card.appendChild(element('div', 'label', label));
    return card;
  }

  function renderProjects() {
    var wrap = $('projects-wrap');
    wrap.textContent = '';
    var rows = stats.projects || [];
    if (!rows.length) {
      wrap.appendChild(element('div', 'muted', t('empty')));
      return;
    }
    var table = document.createElement('table');
    table.className = 'projects-table';
    var head = document.createElement('tr');
    [t('project'), t('sessions'), t('messages'), t('output'), t('fileImpact'), t('lastActive')].forEach(function (label, index) {
      var th = element('th', index >= 1 && index <= 4 ? 'num' : null, label);
      if (index === 2 || index === 4) th.classList.add('optional');
      head.appendChild(th);
    });
    var thead = document.createElement('thead');
    thead.appendChild(head);
    table.appendChild(thead);

    var body = document.createElement('tbody');
    rows.forEach(function (project) {
      var tr = document.createElement('tr');
      var name = element('td', 'name', project.name);
      if (project.path) name.title = project.path;
      var nameMeter = element('div', 'meter name-meter');
      var nameFill = document.createElement('span');
      nameFill.style.width = Math.round(Math.max(0, Math.min(1, project.share || 0)) * 100) + '%';
      nameMeter.appendChild(nameFill);
      name.appendChild(nameMeter);
      tr.appendChild(name);
      tr.appendChild(element('td', 'num', nf.format(project.sessions || 0)));
      tr.appendChild(element('td', 'num optional', nf.format(project.messages || 0)));
      tr.appendChild(element('td', 'num', compactText(project.output)));
      tr.appendChild(element('td', 'num optional', t('fileImpactValue', nf.format(project.edited || 0), nf.format(project.artifacts || 0))));
      tr.appendChild(element('td', 'muted', relative(project.updatedAt)));
      body.appendChild(tr);
    });
    table.appendChild(body);
    var scroller = element('div', 'table-scroll');
    scroller.appendChild(table);
    wrap.appendChild(scroller);
  }

  function renderModels() {
    var wrap = $('models-wrap');
    wrap.textContent = '';
    var rows = stats.models || [];
    if (!rows.length) {
      wrap.appendChild(element('div', 'muted', t('empty')));
      return;
    }
    var totalOutput = rows.reduce(function (sum, model) { return sum + (Number(model.output) || 0); }, 0);
    var list = element('div', 'model-list');
    rows.forEach(function (model) {
      var row = element('div', 'model-row');
      var top = element('div', 'top');
      top.appendChild(element('span', 'name', model.name));
      if (model.provider && model.provider !== model.name) top.appendChild(element('span', 'provider', model.provider));
      var share = totalOutput > 0 ? (Number(model.output) || 0) / totalOutput : 0;
      top.appendChild(element('span', 'share', t('percentValue', (share * 100).toFixed(1))));
      row.appendChild(top);
      var meter = element('div', 'meter');
      var fill = document.createElement('span');
      fill.style.width = Math.round(Math.max(0, Math.min(1, share)) * 100) + '%';
      meter.appendChild(fill);
      row.appendChild(meter);
      var details = element('div', 'stats');
      details.appendChild(element('span', null, t('sessionsCount', nf.format(model.sessions || 0))));
      details.appendChild(element('span', null, t('messageCount', nf.format(model.messages || 0))));
      details.appendChild(element('span', null, t('output') + ' ' + compactText(model.output)));
      row.appendChild(details);
      list.appendChild(row);
    });
    wrap.appendChild(list);
  }

  function renderRecent() {
    var wrap = $('recent');
    wrap.textContent = '';
    var rows = stats.recent || [];
    if (!rows.length) {
      wrap.appendChild(element('div', 'muted', t('empty')));
      return;
    }
    rows.forEach(function (session) {
      var row = element('div', 'row');
      row.appendChild(element('div', 'title', session.title));
      var tags = element('div', 'tags');
      if (session.project) tags.appendChild(element('span', 'tag', session.project));
      if (session.model) tags.appendChild(element('span', 'tag', session.model));
      if (tags.childNodes.length) row.appendChild(tags);
      var details = element('div', 'stats');
      details.appendChild(element('span', 'stat', t('messageCount', nf.format(session.messages || 0))));
      details.appendChild(element('span', 'stat', t('output') + ' ' + compactText(session.output)));
      details.appendChild(element('span', 'stat', t('billed') + ' ' + compactText(session.billed)));
      details.appendChild(element('span', 'stat time', relative(session.updatedAt)));
      row.appendChild(details);
      wrap.appendChild(row);
    });
  }

  function renderFooter() {
    var foot = $('foot');
    foot.textContent = '';
    foot.appendChild(element('div', null, t('footNote')));
    var scan = element('div', null, t('footScan', stats.scannedFiles || 0, stats.scanMilliseconds || 0) + ' ');
    var code = element('code', null, stats.source || '');
    scan.appendChild(code);
    foot.appendChild(scan);
  }

  function render() {
    renderChrome();
    if (!stats) return;
    $('skeleton').classList.add('hidden');
    if (!stats.sessions) {
      $('main').classList.add('hidden');
      showState('', t('emptyTitle'), t('emptyBody'), { label: t('refresh'), run: load });
      return;
    }
    $('state').classList.add('hidden');
    $('main').classList.remove('hidden');
    if (stats.demo) {
      showBanner(t('demo'), null, null);
    } else {
      hideBanner();
    }
    renderKPIs();
    renderTrend();
    renderProfile();
    renderProjects();
    renderModels();
    renderRecent();
    renderFooter();
  }

  var inFlight = null;
  function load() {
    if (inFlight) return inFlight;
    loading = true;
    renderChrome();
    inFlight = readStats()
      .then(function (payload) {
        stats = payload;
        loading = false;
        render();
      })
      .catch(function (error) {
        loading = false;
        var message = (error && error.message) ? error.message : String(error);
        if (stats) {
          // 已经有数据就别把页面清空：顶部挂条错误提示，旧数字继续看。
          renderChrome();
          showBanner(t('errorTitle') + '：' + message, 'error', { label: t('retry'), run: load });
        } else {
          showState('error', t('errorTitle'), message, { label: t('retry'), run: load });
        }
      })
      .then(function () { inFlight = null; });
    return inFlight;
  }

  function copyText(value) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(value).then(function () { return true; }, legacy);
    }
    return Promise.resolve(legacy());

    function legacy() {
      try {
        var area = document.createElement('textarea');
        area.value = value;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(area);
        return ok;
      } catch (error) {
        return false;
      }
    }
  }

  function updateTrendHover(event) {
    if (!trendGeometry || !trendDays.length) return;
    var canvas = $('trend');
    var rect = canvas.getBoundingClientRect();
    var x = event.clientX - rect.left;
    var raw = Math.floor((x - trendGeometry.left) / trendGeometry.slot);
    var index = Math.max(0, Math.min(trendDays.length - 1, raw));
    if (x < trendGeometry.left || x > trendGeometry.left + trendGeometry.width) {
      clearTrendHover();
      return;
    }
    trendHoverIndex = index;
    var day = trendDays[index];
    var tooltip = $('trend-tooltip');
    tooltip.textContent = t('dayDetail', fullDayLabel(day.date), nf.format(day.output || 0),
      nf.format(day.requests || 0), nf.format(day.messages || 0), nf.format(day.billed || 0));
    tooltip.style.left = Math.max(92, Math.min(rect.width - 92, x)) + 'px';
    tooltip.classList.remove('hidden');
    drawTrend();
  }

  function clearTrendHover() {
    if (trendHoverIndex === null) return;
    trendHoverIndex = null;
    $('trend-tooltip').classList.add('hidden');
    drawTrend();
  }

  $('trend').addEventListener('pointermove', updateTrendHover);
  $('trend').addEventListener('pointerleave', clearTrendHover);
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(scheduleTrendDraw).observe($('trend'));
  } else {
    window.addEventListener('resize', scheduleTrendDraw);
  }

  $('refresh').addEventListener('click', function () { load(); });
  $('export').addEventListener('click', function () {
    var button = $('export');
    button.disabled = true;
    button.textContent = t('exporting');
    request('tools/call', { name: 'vitality.export', arguments: {} })
      .then(function (result) {
        var entry = result && result.content && result.content[0];
        var markdown = entry && entry.text;
        if (!markdown) throw new Error('empty export');
        return copyText(markdown);
      })
      .then(function (ok) {
        button.textContent = ok ? t('exported') : t('exportFailed');
      })
      .catch(function () {
        button.textContent = t('exportFailed');
      })
      .then(function () {
        window.setTimeout(function () {
          button.disabled = false;
          button.textContent = t('export');
        }, 1600);
      });
  });

  // 握手：先拿 hostContext，再声明 initialized（宿主在这之后才受理
  // resources/read 与 tools/call），最后才去取数。顺序反了会被宿主
  // 以 -32002 "MCP App is not initialized" 顶回来。
  request('ui/initialize', {
    protocolVersion: '2026-01-26',
    appCapabilities: {},
    clientInfo: { name: 'willdeep-session-vitality', version: '2.0.0' }
  }).then(function (result) {
    ctx = (result && result.hostContext && result.hostContext.willdeep) || {};
    notify('ui/notifications/initialized', {});
    renderChrome();
    return load();
  }).catch(function (error) {
    showState('error', t('errorTitle'), (error && error.message) ? error.message : String(error),
      { label: t('retry'), run: function () { window.location.reload(); } });
  });

  renderChrome();
})();
</script>
</body>
</html>
