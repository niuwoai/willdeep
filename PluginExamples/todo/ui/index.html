<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待办</title>
    <style>
      /*
       * 待办页面：纯静态页，没有构建步骤，也不引任何外部资源
       * （插件页跑在 CSP 收紧的 WKWebView 里，connect-src 是 'none'）。
       *
       * 两个宿主桥：
       *   window.willdeep.executeCommand → 插件自己的 MCP 工具（落盘、查询）
       *   window.willdeep.ai.complete     → 问模型（一句话拆出时间与优先级）
       * 配色从宿主注入的 --willdeep-* 派生；布局只用 % 与 flex/grid。
       */
      :root {
        --fg: var(--willdeep-fg, #1a1a1c);
        --muted: var(--willdeep-secondary, #6c6c70);
        --surface: color-mix(in srgb, var(--fg) 5%, transparent);
        --surface-strong: color-mix(in srgb, var(--fg) 9%, transparent);
        --border: color-mix(in srgb, var(--fg) 15%, transparent);
        --border-strong: color-mix(in srgb, var(--fg) 34%, transparent);
        --danger: #e5484d;
        --urgent: #e5484d;
        --high: #e8a33d;
        --normal: #4c8cf5;
        --low: #8a8f98;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 18px 20px 96px;
        color: var(--fg);
        font: 13.5px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button, input, textarea, select {
        font: inherit; color: inherit; background: none; border: none; padding: 0;
      }
      button { cursor: pointer; }
      .hidden { display: none !important; }

      header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
      h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: .2px; }
      .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      .toolbar { margin-left: auto; display: flex; align-items: center; gap: 6px; }
      .chip {
        border: 1px solid var(--border); border-radius: 7px;
        padding: 4px 10px; font-size: 12px; white-space: nowrap;
      }
      .chip:hover { border-color: var(--border-strong); }
      .chip[aria-pressed="true"] { background: var(--surface-strong); border-color: var(--border-strong); }
      .chip.danger:hover { border-color: var(--danger); color: var(--danger); }

      /* ── 快速输入 ─────────────────────────────────────────── */
      .composer {
        border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); padding: 10px 12px; margin-bottom: 12px;
      }
      .composer.busy { border-color: var(--border-strong); }
      .composer .row { display: flex; align-items: center; gap: 8px; }
      .composer input[type="text"] { flex: 1; outline: none; font-size: 14px; }
      .composer input::placeholder { color: var(--muted); }
      .composer .hint { margin-top: 7px; font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .badge {
        border-radius: 999px; padding: 1px 8px; font-size: 11px;
        border: 1px solid var(--border); color: var(--muted);
      }
      .badge.due { border-color: color-mix(in srgb, var(--normal) 45%, var(--border)); }
      .badge.p-urgent { border-color: var(--urgent); color: var(--urgent); }
      .badge.p-high { border-color: var(--high); color: var(--high); }
      .badge.p-normal { border-color: var(--normal); color: var(--normal); }
      .badge.p-low { border-color: var(--border-strong); }
      .badge.model { font-variant-numeric: tabular-nums; }

      /* ── 过滤条 ───────────────────────────────────────────── */
      .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; align-items: center; }
      .filters .sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; }
      .filters .chip { font-size: 11.5px; padding: 3px 9px; }
      .filters .chip .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }

      /* ── 列表 ─────────────────────────────────────────────── */
      .group { margin-bottom: 18px; }
      .group h2 {
        font-size: 11.5px; font-weight: 600; color: var(--muted);
        text-transform: uppercase; letter-spacing: .4px; margin: 0 0 8px;
      }
      .group.overdue h2 { color: var(--danger); }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      li.item {
        display: flex; gap: 10px; align-items: flex-start;
        border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); padding: 10px 12px;
      }
      li.item[data-done="true"] { opacity: .55; }
      li.item[data-priority="urgent"] { border-left: 3px solid var(--urgent); }
      li.item[data-priority="high"] { border-left: 3px solid var(--high); }
      li.item[data-priority="normal"] { border-left: 3px solid var(--normal); }
      li.item[data-priority="low"] { border-left: 3px solid var(--low); }
      .check {
        width: 17px; height: 17px; flex: 0 0 auto; margin-top: 2px;
        border: 1.5px solid var(--border-strong); border-radius: 5px;
        display: inline-flex; align-items: center; justify-content: center;
        font-size: 11px; line-height: 1; color: transparent;
      }
      .check:hover { border-color: var(--fg); }
      li.item[data-done="true"] .check { color: var(--fg); background: var(--surface-strong); }
      .body { flex: 1; min-width: 0; }
      .title { word-break: break-word; overflow-wrap: anywhere; cursor: text; }
      li.item[data-done="true"] .title { text-decoration: line-through; }
      .title-editor {
        width: 100%; outline: none; border: 1px solid var(--border-strong);
        border-radius: 6px; padding: 3px 7px; background: var(--surface-strong);
      }
      .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
      .meta .badge { cursor: pointer; }
      .meta .badge:hover { border-color: var(--border-strong); color: var(--fg); }
      .meta .badge.overdue { border-color: var(--danger); color: var(--danger); }
      .meta .spacer { margin-left: auto; }
      .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .12s ease; }
      li.item:hover .actions, li.item:focus-within .actions { opacity: 1; }
      .actions button { color: var(--muted); font-size: 11.5px; border-radius: 6px; padding: 2px 7px; }
      .actions button:hover { color: var(--fg); background: var(--surface-strong); }
      .actions button.danger:hover { color: var(--danger); }
      .editor-row { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; align-items: center; }
      .editor-row input[type="datetime-local"], .editor-row select {
        border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px;
        background: var(--surface-strong); outline: none; font-size: 12px;
      }

      /* ── 状态位 ───────────────────────────────────────────── */
      .state { padding: 40px 12px; text-align: center; color: var(--muted); }
      .state .headline { color: var(--fg); font-size: 14px; margin-bottom: 6px; }
      .state.error .headline { color: var(--danger); }
      .skeleton { display: flex; flex-direction: column; gap: 8px; }
      .skeleton div { height: 44px; border-radius: var(--radius); background: var(--surface); animation: pulse 1.4s ease-in-out infinite; }
      .skeleton div:nth-child(2) { animation-delay: .16s; }
      .skeleton div:nth-child(3) { animation-delay: .32s; }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: .9; } }

      /* ── 设置抽屉 ─────────────────────────────────────────── */
      .settings {
        border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); padding: 12px 14px; margin-bottom: 14px;
      }
      .settings h3 { margin: 0 0 8px; font-size: 12.5px; font-weight: 600; }
      .settings .line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
      .settings label { font-size: 12px; color: var(--muted); }
      .settings select { border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; background: var(--surface-strong); }
      .settings .note { font-size: 11.5px; color: var(--muted); line-height: 1.6; }

      /* ── 撤销条 ───────────────────────────────────────────── */
      .toast {
        position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 12px);
        display: flex; align-items: center; gap: 12px; padding: 8px 12px;
        border-radius: 9px; border: 1px solid var(--border-strong);
        background: color-mix(in srgb, var(--willdeep-bg, #1c1c1e) 86%, var(--fg));
        box-shadow: 0 6px 24px rgba(0, 0, 0, .32);
        font-size: 12.5px; opacity: 0; pointer-events: none;
        transition: opacity .15s ease, transform .15s ease; max-width: 90%;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
      .toast.error { border-color: color-mix(in srgb, var(--danger) 60%, var(--border)); color: var(--danger); }
      .toast .undo { font-weight: 600; }
      .toast .undo:hover { text-decoration: underline; }
      @media (prefers-reduced-motion: reduce) { .skeleton div { animation: none; } .toast { transition: none; } }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">待办</h1>
      <span class="count" id="count"></span>
      <div class="toolbar">
        <button class="chip" id="settings-toggle" type="button"></button>
        <button class="chip" id="refresh" type="button"></button>
      </div>
    </header>

    <div class="composer" id="composer">
      <div class="row">
        <span aria-hidden="true">＋</span>
        <input id="quick" type="text" autocomplete="off" spellcheck="false" />
        <button class="chip" id="quick-add" type="button"></button>
      </div>
      <div class="hint" id="quick-hint"></div>
    </div>

    <div class="settings hidden" id="settings">
      <h3 id="settings-title"></h3>
      <div class="line">
        <label for="parser-mode" id="parser-label"></label>
        <select id="parser-mode"></select>
        <label for="provider-select" id="provider-label"></label>
        <select id="provider-select"></select>
        <select id="model-select"></select>
      </div>
      <div class="note" id="settings-note"></div>
    </div>

    <div class="filters" id="filters"></div>

    <div class="skeleton" id="skeleton"><div></div><div></div><div></div></div>
    <div class="state hidden" id="state"></div>
    <div id="groups"></div>

    <div class="toast" id="toast">
      <span id="toast-text"></span>
      <button class="undo hidden" id="toast-undo" type="button"></button>
    </div>

    <script>
      (function () {
        'use strict';

        var STRINGS = {
          zh: {
            title: '待办',
            quickPlaceholder: '一句话记个待办，比如「明天下午三点前把发布验一遍，很急」',
            add: '记下',
            adding: '正在理解…',
            refresh: '刷新',
            settings: '设置',
            settingsTitle: '一句话怎么解析',
            parserLabel: '解析方式',
            parserAI: '交给模型',
            parserLocal: '本地规则',
            providerLabel: '模型',
            providerDefault: '默认（当前 provider 的 flash 档）',
            settingsNote: '「交给模型」会把你写的那一句话发给下面选中的模型，只要它回一段 JSON：标题、计划时间、优先级。'
              + '模型不可用、超时或者答非所问时，自动回落到本地规则解析，绝不把这条待办弄丢。本地规则不联网、不花 token。',
            scopeAll: '全部项目',
            scopeProject: '当前项目',
            scopeInbox: '未归项目',
            statusOpen: '未完成',
            statusDone: '已完成',
            statusAll: '全部',
            overdue: '已逾期',
            today: '今天',
            tomorrow: '明天',
            week: '本周内',
            later: '以后',
            someday: '没定时间',
            done: '已完成',
            emptyTitle: '这里还没有待办',
            emptyBody: '在上面写一句话，或者在聊天正文里选中一段文字点「加到待办」。',
            noMatchTitle: '这个筛选下没有待办',
            noMatchBody: '换个范围看看，或者把状态切到「全部」。',
            errorTitle: '读不到待办',
            retry: '重试',
            remove: '删除',
            removed: '已删除 1 条待办',
            undo: '撤销',
            priority: '优先级',
            priorityNone: '无',
            urgent: '紧急',
            high: '高',
            normal: '中',
            low: '低',
            due: '计划时间',
            dueNone: '无时间',
            project: '项目',
            inbox: '未归项目',
            justNow: '刚刚',
            parsedBy: function (name) { return '由 ' + name + ' 理解'; },
            parsedLocally: '本地规则理解',
            fallback: '模型没搭上话，改用本地规则',
            bridgeMissing: '插件桥接不可用：这个页面需要在 WillDeep 里打开。'
          },
          en: {
            title: 'Todo',
            quickPlaceholder: 'One sentence, e.g. “verify the release by 3pm tomorrow, urgent”',
            add: 'Add',
            adding: 'Reading…',
            refresh: 'Refresh',
            settings: 'Settings',
            settingsTitle: 'How one sentence is read',
            parserLabel: 'Parser',
            parserAI: 'Ask a model',
            parserLocal: 'Built-in rules',
            providerLabel: 'Model',
            providerDefault: 'Default (current provider, flash tier)',
            settingsNote: '“Ask a model” sends just that one sentence to the selected model and expects a small JSON back: '
              + 'title, due date, priority. If the model is unavailable, times out or answers off-format, the built-in rules take over — '
              + 'the todo is never lost. The built-in rules need no network and cost no tokens.',
            scopeAll: 'All projects',
            scopeProject: 'This project',
            scopeInbox: 'Unfiled',
            statusOpen: 'Open',
            statusDone: 'Done',
            statusAll: 'All',
            overdue: 'Overdue',
            today: 'Today',
            tomorrow: 'Tomorrow',
            week: 'This week',
            later: 'Later',
            someday: 'No date',
            done: 'Done',
            emptyTitle: 'No todos yet',
            emptyBody: 'Write one sentence above, or select text in the chat and hit “Add to todo”.',
            noMatchTitle: 'Nothing under this filter',
            noMatchBody: 'Try another scope, or switch the status to “All”.',
            errorTitle: 'Could not read todos',
            retry: 'Retry',
            remove: 'Delete',
            removed: 'Todo deleted',
            undo: 'Undo',
            priority: 'Priority',
            priorityNone: 'None',
            urgent: 'Urgent',
            high: 'High',
            normal: 'Normal',
            low: 'Low',
            due: 'Due',
            dueNone: 'No date',
            project: 'Project',
            inbox: 'Unfiled',
            justNow: 'just now',
            parsedBy: function (name) { return 'read by ' + name; },
            parsedLocally: 'read by built-in rules',
            fallback: 'The model did not answer; used the built-in rules',
            bridgeMissing: 'Plugin bridge unavailable: open this page inside WillDeep.'
          }
        };

        function context() {
          return (window.willdeep && window.willdeep.getContext) ? (window.willdeep.getContext() || {}) : {};
        }
        function lang() {
          return String(context().locale || navigator.language || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
        }
        function t(key) {
          var value = STRINGS[lang()][key];
          return typeof value === 'function' ? value.apply(null, [].slice.call(arguments, 1)) : value;
        }

        // ── 宿主桥 ──────────────────────────────────────────
        function runCommand(commandID, args) {
          if (!window.willdeep || typeof window.willdeep.executeCommand !== 'function') {
            return Promise.reject(new Error(t('bridgeMissing')));
          }
          return window.willdeep.executeCommand(commandID, args || {}).then(unwrap);
        }

        function unwrap(raw) {
          var payload = parseJSON(raw);
          if (payload && Array.isArray(payload.content)) {
            var text = null;
            payload.content.forEach(function (entry) {
              if (text === null && entry && typeof entry.text === 'string') text = entry.text;
            });
            payload = parseJSON(text);
          }
          if (payload && payload.ok === false) throw new Error(String(payload.error || 'unknown error'));
          return payload;
        }

        function parseJSON(raw) {
          if (raw === null || raw === undefined) return null;
          if (typeof raw === 'object') return raw;
          try { return JSON.parse(String(raw)); } catch (error) { return null; }
        }

        // ── 状态 ────────────────────────────────────────────
        var state = {
          items: [], projects: [], buckets: {}, total: 0,
          scope: 'all', status: 'open', query: '',
          settings: { parser: 'ai', providerID: null, model: null },
          providers: [],
          loaded: false, editing: null, busy: false
        };
        var lastRemoved = null;
        var toastTimer = null;

        var el = {};
        ['title', 'count', 'refresh', 'settings-toggle', 'settings', 'settings-title', 'parser-label',
         'parser-mode', 'provider-label', 'provider-select', 'model-select', 'settings-note',
         'filters', 'skeleton', 'state', 'groups', 'toast', 'toast-text', 'toast-undo',
         'composer', 'quick', 'quick-add', 'quick-hint'].forEach(function (id) {
          el[id] = document.getElementById(id);
        });

        function workspacePath() {
          return context().workspaceReference || '';
        }

        // ── 一句话 → 结构化 ──────────────────────────────────
        var AI_SYSTEM = [
          'You turn one sentence into a todo. Reply with ONLY a JSON object, no prose, no code fence.',
          'Keys: title (string, the action with time/priority words removed),',
          'due (ISO 8601 local time like 2026-08-28T15:00:00, or null),',
          'allDay (boolean, true when only a date was given),',
          'priority (one of urgent, high, normal, low, or null).',
          'Keep the title in the language the user wrote. Never invent a due date that was not implied.'
        ].join(' ');

        function aiAvailable() {
          return !!(window.willdeep && window.willdeep.ai && typeof window.willdeep.ai.complete === 'function');
        }

        function parseWithModel(sentence) {
          if (state.settings.parser !== 'ai' || !aiAvailable()) return Promise.resolve(null);
          var request = {
            system: AI_SYSTEM,
            messages: [{
              role: 'user',
              content: 'Now: ' + new Date().toISOString() + ' (local offset ' + (-new Date().getTimezoneOffset() / 60) + 'h)\n'
                + 'Sentence: ' + sentence
            }],
            maxOutputTokens: 256
          };
          if (state.settings.providerID) request.provider = state.settings.providerID;
          if (state.settings.model) request.model = state.settings.model;
          return window.willdeep.ai.complete(request).then(function (result) {
            var payload = extractJSON(result && result.text);
            if (!payload || !payload.title) return null;
            return {
              text: String(payload.title).trim(),
              due: normalizeDue(payload.due),
              allDay: payload.allDay === true,
              priority: ['urgent', 'high', 'normal', 'low'].indexOf(payload.priority) >= 0 ? payload.priority : null,
              model: result.model
            };
          }).catch(function () { return null; });
        }

        // 模型偶尔会裹一层 ``` 或者前后加半句话，取第一个平衡的 JSON 对象。
        function extractJSON(text) {
          if (!text) return null;
          var direct = parseJSON(text);
          if (direct && typeof direct === 'object') return direct;
          var start = text.indexOf('{');
          if (start === -1) return null;
          var depth = 0;
          for (var i = start; i < text.length; i++) {
            if (text[i] === '{') depth++;
            else if (text[i] === '}') {
              depth--;
              if (depth === 0) return parseJSON(text.slice(start, i + 1));
            }
          }
          return null;
        }

        function normalizeDue(value) {
          if (!value) return null;
          var date = new Date(value);
          return isNaN(date.getTime()) ? null : date.toISOString();
        }

        function quickAdd() {
          var sentence = el.quick.value.trim();
          if (!sentence || state.busy) return;
          state.busy = true;
          el.composer.classList.add('busy');
          el['quick-add'].textContent = t('adding');
          parseWithModel(sentence)
            .then(function (parsed) {
              if (parsed) {
                return runCommand('todo.add', {
                  text: parsed.text,
                  due: parsed.due,
                  allDay: parsed.allDay,
                  priority: parsed.priority,
                  projectPath: workspacePath(),
                  source: 'todo.page'
                }).then(function (payload) {
                  return { payload: payload, by: t('parsedBy', parsed.model || 'AI') };
                });
              }
              // 模型没接上（关了、超时、答非所问）就走本地规则，绝不把这条弄丢
              return runCommand('todo.quick_add', {
                text: sentence,
                projectPath: workspacePath(),
                source: 'todo.page'
              }).then(function (payload) {
                var by = (state.settings.parser === 'ai' && aiAvailable()) ? t('fallback') : t('parsedLocally');
                return { payload: payload, by: by };
              });
            })
            .then(function (result) {
              el.quick.value = '';
              renderQuickHint(result.payload && result.payload.item, result.by);
              return load();
            })
            .catch(fail)
            .then(function () {
              state.busy = false;
              el.composer.classList.remove('busy');
              el['quick-add'].textContent = t('add');
            });
        }

        function renderQuickHint(item, by) {
          el['quick-hint'].textContent = '';
          if (!item) return;
          if (item.due) el['quick-hint'].appendChild(badge('due', formatDue(item.due, item.allDay)));
          if (item.priority) el['quick-hint'].appendChild(badge('p-' + item.priority, t(item.priority)));
          if (item.project) el['quick-hint'].appendChild(badge('', item.project));
          if (by) el['quick-hint'].appendChild(badge('model', by));
          window.setTimeout(function () {
            if (el['quick-hint']) el['quick-hint'].textContent = '';
          }, 8000);
        }

        function badge(kind, text) {
          var node = document.createElement('span');
          node.className = 'badge' + (kind ? ' ' + kind : '');
          node.textContent = text;
          return node;
        }

        // ── 时间 ────────────────────────────────────────────
        function parseDate(iso) {
          if (!iso) return null;
          var date = new Date(iso);
          return isNaN(date.getTime()) ? null : date;
        }
        function formatDue(iso, allDay) {
          var date = parseDate(iso);
          if (!date) return '';
          var today = new Date();
          var sameYear = date.getFullYear() === today.getFullYear();
          var day = date.toLocaleDateString([], sameYear ? { month: 'short', day: 'numeric' } : undefined);
          if (allDay) return day;
          return day + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        function isOverdue(item) {
          var date = parseDate(item.due);
          return !item.done && !!date && date.getTime() < Date.now();
        }
        function bucketOf(item) {
          if (item.done) return 'done';
          var date = parseDate(item.due);
          if (!date) return 'someday';
          if (date.getTime() < Date.now()) return 'overdue';
          var startOfToday = new Date();
          startOfToday.setHours(0, 0, 0, 0);
          var days = Math.floor((date - startOfToday) / 86400000);
          if (days <= 0) return 'today';
          if (days === 1) return 'tomorrow';
          if (days <= 7) return 'week';
          return 'later';
        }

        // ── 渲染 ────────────────────────────────────────────
        function renderChrome() {
          document.documentElement.lang = lang() === 'zh' ? 'zh-Hans' : 'en';
          el.title.textContent = t('title');
          el.refresh.textContent = t('refresh');
          el['settings-toggle'].textContent = t('settings');
          el['settings-title'].textContent = t('settingsTitle');
          el['parser-label'].textContent = t('parserLabel');
          el['provider-label'].textContent = t('providerLabel');
          el['settings-note'].textContent = t('settingsNote');
          el.quick.placeholder = t('quickPlaceholder');
          if (!state.busy) el['quick-add'].textContent = t('add');
        }

        function renderFilters() {
          el.filters.textContent = '';
          var scopes = [['all', t('scopeAll')], ['project', t('scopeProject')], ['inbox', t('scopeInbox')]];
          scopes.forEach(function (entry) {
            if (entry[0] === 'project' && !workspacePath()) return;
            el.filters.appendChild(filterChip(entry[1], state.scope === entry[0], function () {
              state.scope = entry[0];
              load();
            }));
          });
          var sep = document.createElement('span');
          sep.className = 'sep';
          el.filters.appendChild(sep);
          [['open', t('statusOpen')], ['done', t('statusDone')], ['all', t('statusAll')]].forEach(function (entry) {
            el.filters.appendChild(filterChip(entry[1], state.status === entry[0], function () {
              state.status = entry[0];
              load();
            }));
          });
        }

        function filterChip(label, active, run) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'chip';
          button.textContent = label;
          button.setAttribute('aria-pressed', String(!!active));
          button.addEventListener('click', run);
          return button;
        }

        var GROUP_ORDER = ['overdue', 'today', 'tomorrow', 'week', 'later', 'someday', 'done'];

        function render() {
          renderChrome();
          renderFilters();
          el.groups.textContent = '';
          if (!state.loaded) return;
          el.skeleton.classList.add('hidden');

          if (!state.items.length) {
            showState('', state.total ? t('noMatchTitle') : t('emptyTitle'),
                      state.total ? t('noMatchBody') : t('emptyBody'));
            el.count.textContent = '';
            return;
          }
          el.state.classList.add('hidden');
          var open = state.items.filter(function (item) { return !item.done; }).length;
          el.count.textContent = open + ' / ' + state.items.length;

          var grouped = {};
          state.items.forEach(function (item) {
            var key = bucketOf(item);
            (grouped[key] = grouped[key] || []).push(item);
          });
          GROUP_ORDER.forEach(function (key) {
            var rows = grouped[key];
            if (!rows || !rows.length) return;
            var section = document.createElement('div');
            section.className = 'group' + (key === 'overdue' ? ' overdue' : '');
            var heading = document.createElement('h2');
            heading.textContent = t(key) + ' · ' + rows.length;
            section.appendChild(heading);
            var list = document.createElement('ul');
            rows.forEach(function (item) { list.appendChild(row(item)); });
            section.appendChild(list);
            el.groups.appendChild(section);
          });
        }

        function row(item) {
          var li = document.createElement('li');
          li.className = 'item';
          li.dataset.done = String(!!item.done);
          if (item.priority) li.dataset.priority = item.priority;

          var check = document.createElement('button');
          check.type = 'button';
          check.className = 'check';
          check.textContent = '✓';
          check.addEventListener('click', function () {
            runCommand('todo.toggle', { id: item.id }).then(load).catch(fail);
          });
          li.appendChild(check);

          var body = document.createElement('div');
          body.className = 'body';

          if (state.editing === item.id) {
            var editor = document.createElement('input');
            editor.type = 'text';
            editor.className = 'title-editor';
            editor.value = item.text;
            var commit = function (save) {
              if (state.editing !== item.id) return;
              state.editing = null;
              var next = editor.value.trim();
              if (save && next && next !== item.text) {
                runCommand('todo.update', { id: item.id, text: next }).then(load).catch(fail);
              } else {
                render();
              }
            };
            editor.addEventListener('keydown', function (event) {
              if (event.key === 'Enter') { event.preventDefault(); commit(true); }
              else if (event.key === 'Escape') { event.stopPropagation(); commit(false); }
            });
            editor.addEventListener('blur', function () { commit(true); });
            window.setTimeout(function () { editor.focus(); editor.select(); }, 0);
            body.appendChild(editor);
          } else {
            var title = document.createElement('div');
            title.className = 'title';
            title.textContent = item.text;
            title.addEventListener('click', function () {
              state.editing = item.id;
              render();
            });
            body.appendChild(title);
          }

          var meta = document.createElement('div');
          meta.className = 'meta';

          var due = badge('due' + (isOverdue(item) ? ' overdue' : ''), item.due ? formatDue(item.due, item.allDay) : t('dueNone'));
          due.addEventListener('click', function () { toggleEditors(li, item, 'due'); });
          meta.appendChild(due);

          var priority = badge(item.priority ? 'p-' + item.priority : '', item.priority ? t(item.priority) : t('priorityNone'));
          priority.addEventListener('click', function () { toggleEditors(li, item, 'priority'); });
          meta.appendChild(priority);

          if (item.project) {
            var project = badge('', item.project);
            if (item.projectPath) project.title = item.projectPath;
            meta.appendChild(project);
          }

          var spacer = document.createElement('span');
          spacer.className = 'spacer';
          meta.appendChild(spacer);

          var actions = document.createElement('div');
          actions.className = 'actions';
          var remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'danger';
          remove.textContent = t('remove');
          remove.addEventListener('click', function () {
            remove.disabled = true;
            runCommand('todo.remove', { id: item.id })
              .then(function (payload) {
                lastRemoved = (payload && payload.item) || item;
                toast(t('removed'), t('undo'), undoRemove);
                return load();
              })
              .catch(function (error) { remove.disabled = false; fail(error); });
          });
          actions.appendChild(remove);
          meta.appendChild(actions);

          body.appendChild(meta);
          li.appendChild(body);
          return li;
        }

        // 时间与优先级就地改：点 chip 展开一行原生控件，改完立即落盘
        function toggleEditors(li, item, focus) {
          var existing = li.querySelector('.editor-row');
          if (existing) { existing.parentNode.removeChild(existing); return; }
          var rowEl = document.createElement('div');
          rowEl.className = 'editor-row';

          var dueInput = document.createElement('input');
          dueInput.type = 'datetime-local';
          var date = parseDate(item.due);
          if (date) {
            var pad = function (value) { return String(value).padStart(2, '0'); };
            dueInput.value = date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
              + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
          }
          dueInput.addEventListener('change', function () {
            var value = dueInput.value ? new Date(dueInput.value).toISOString() : '';
            runCommand('todo.update', { id: item.id, due: value, allDay: false }).then(load).catch(fail);
          });
          rowEl.appendChild(dueInput);

          var clear = document.createElement('button');
          clear.type = 'button';
          clear.className = 'chip';
          clear.textContent = t('dueNone');
          clear.addEventListener('click', function () {
            runCommand('todo.update', { id: item.id, due: '' }).then(load).catch(fail);
          });
          rowEl.appendChild(clear);

          var select = document.createElement('select');
          [['', t('priorityNone')], ['urgent', t('urgent')], ['high', t('high')],
           ['normal', t('normal')], ['low', t('low')]].forEach(function (entry) {
            var option = document.createElement('option');
            option.value = entry[0];
            option.textContent = entry[1];
            if ((item.priority || '') === entry[0]) option.selected = true;
            select.appendChild(option);
          });
          select.addEventListener('change', function () {
            runCommand('todo.update', { id: item.id, priority: select.value }).then(load).catch(fail);
          });
          rowEl.appendChild(select);

          li.querySelector('.body').appendChild(rowEl);
          window.setTimeout(function () { (focus === 'priority' ? select : dueInput).focus(); }, 0);
        }

        function undoRemove() {
          if (!lastRemoved) return;
          var item = lastRemoved;
          lastRemoved = null;
          hideToast();
          runCommand('todo.restore', { item: item }).then(load).catch(fail);
        }

        function showState(kind, headline, body) {
          el.state.className = 'state' + (kind ? ' ' + kind : '');
          el.state.textContent = '';
          var head = document.createElement('div');
          head.className = 'headline';
          head.textContent = headline;
          el.state.appendChild(head);
          if (body) {
            var detail = document.createElement('div');
            detail.textContent = body;
            el.state.appendChild(detail);
          }
          el.state.classList.remove('hidden');
        }

        // ── 设置 ────────────────────────────────────────────
        function renderSettings() {
          el['parser-mode'].textContent = '';
          [['ai', t('parserAI')], ['local', t('parserLocal')]].forEach(function (entry) {
            var option = document.createElement('option');
            option.value = entry[0];
            option.textContent = entry[1];
            if (state.settings.parser === entry[0]) option.selected = true;
            el['parser-mode'].appendChild(option);
          });

          el['provider-select'].textContent = '';
          var none = document.createElement('option');
          none.value = '';
          none.textContent = t('providerDefault');
          el['provider-select'].appendChild(none);
          state.providers.forEach(function (provider) {
            var option = document.createElement('option');
            option.value = provider.providerID;
            option.textContent = provider.displayName + (provider.isLocal ? ' · local' : '');
            if (state.settings.providerID === provider.providerID) option.selected = true;
            el['provider-select'].appendChild(option);
          });
          renderModelOptions();
        }

        function renderModelOptions() {
          var providerID = el['provider-select'].value;
          var provider = state.providers.filter(function (entry) { return entry.providerID === providerID; })[0];
          el['model-select'].textContent = '';
          el['model-select'].classList.toggle('hidden', !provider);
          if (!provider) return;
          var auto = document.createElement('option');
          auto.value = '';
          auto.textContent = provider.flashModel || 'auto';
          el['model-select'].appendChild(auto);
          (provider.models || []).forEach(function (model) {
            var option = document.createElement('option');
            option.value = model;
            option.textContent = model;
            if (state.settings.model === model) option.selected = true;
            el['model-select'].appendChild(option);
          });
        }

        function saveSettings() {
          state.settings.parser = el['parser-mode'].value;
          state.settings.providerID = el['provider-select'].value || null;
          state.settings.model = el['model-select'].value || null;
          runCommand('todo.settings', {
            parser: state.settings.parser,
            providerID: state.settings.providerID || '',
            model: state.settings.model || ''
          }).catch(fail);
        }

        function loadProviders() {
          if (!window.willdeep || !window.willdeep.ai || typeof window.willdeep.ai.providers !== 'function') {
            return Promise.resolve();
          }
          return window.willdeep.ai.providers().then(function (payload) {
            state.providers = (payload && payload.providers) || [];
            renderSettings();
          }).catch(function () { state.providers = []; });
        }

        // ── 提示条 ──────────────────────────────────────────
        function toast(message, actionLabel, action) {
          el.toast.classList.remove('error');
          el['toast-text'].textContent = message;
          if (actionLabel && action) {
            el['toast-undo'].textContent = actionLabel;
            el['toast-undo'].classList.remove('hidden');
            el['toast-undo'].onclick = action;
          } else {
            el['toast-undo'].classList.add('hidden');
            el['toast-undo'].onclick = null;
          }
          el.toast.classList.add('show');
          window.clearTimeout(toastTimer);
          toastTimer = window.setTimeout(hideToast, 6000);
        }
        function hideToast() {
          el.toast.classList.remove('show');
          window.clearTimeout(toastTimer);
        }
        function fail(error) {
          var message = (error && error.message) ? error.message : String(error);
          if (!state.loaded) {
            el.skeleton.classList.add('hidden');
            showState('error', t('errorTitle'), message);
            return;
          }
          el.toast.classList.add('error');
          el['toast-text'].textContent = message;
          el['toast-undo'].classList.add('hidden');
          el.toast.classList.add('show');
          window.clearTimeout(toastTimer);
          toastTimer = window.setTimeout(hideToast, 6000);
        }

        // ── 载入 ────────────────────────────────────────────
        var inFlight = null;
        function load() {
          if (inFlight) return inFlight;
          inFlight = runCommand('todo.list', {
            scope: state.scope,
            status: state.status,
            projectPath: workspacePath()
          })
            .then(function (payload) {
              state.items = (payload && payload.items) || [];
              state.projects = (payload && payload.projects) || [];
              state.buckets = (payload && payload.buckets) || {};
              state.total = (payload && payload.total) || 0;
              if (payload && payload.settings) {
                state.settings = payload.settings;
                renderSettings();
              }
              state.loaded = true;
              el.state.classList.add('hidden');
              render();
            })
            .catch(fail)
            .then(function () { inFlight = null; });
          return inFlight;
        }

        // ── 事件 ────────────────────────────────────────────
        el.quick.addEventListener('keydown', function (event) {
          if (event.key === 'Enter') { event.preventDefault(); quickAdd(); }
        });
        el['quick-add'].addEventListener('click', quickAdd);
        el.refresh.addEventListener('click', function () { load(); });
        el['settings-toggle'].addEventListener('click', function () {
          var hidden = el.settings.classList.toggle('hidden');
          el['settings-toggle'].setAttribute('aria-pressed', String(!hidden));
          if (!hidden && !state.providers.length) loadProviders();
        });
        el['parser-mode'].addEventListener('change', saveSettings);
        el['provider-select'].addEventListener('change', function () {
          state.settings.model = null;
          renderModelOptions();
          saveSettings();
        });
        el['model-select'].addEventListener('change', saveSettings);

        document.addEventListener('keydown', function (event) {
          var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
          if ((event.metaKey || event.ctrlKey) && event.key === 'n') {
            event.preventDefault();
            el.quick.focus();
          } else if (event.key === 'Escape' && !typing) {
            hideToast();
          }
        });

        window.addEventListener('willdeep:context-changed', function () {
          renderChrome();
          load();
        });

        renderChrome();
        renderSettings();
        load();
        loadProviders();
      })();
    </script>
  </body>
</html>
