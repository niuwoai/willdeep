name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby-guards:
    name: Ruby guards (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group:
          - quality
          - interaction
          - short-drama

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 插件已经拆成独立仓库，PluginExamples/ 下是 submodule。不拉的话
          # 那里是 11 个空目录，构建会在拷贝内置插件那一步炸。
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Print toolchain
        run: ruby --version

      - name: Run guard group
        run: ruby scripts/run_ci_guard_group.rb "${{ matrix.group }}" build/ci

      - name: Upload guard reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: xedit-guard-${{ matrix.group }}
          path: build/ci
          retention-days: 7

  go-agent-tests:
    name: Go agent tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 插件已经拆成独立仓库，PluginExamples/ 下是 submodule。不拉的话
          # 那里是 11 个空目录，构建会在拷贝内置插件那一步炸。
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: willdeep-agent/go.mod
          cache-dependency-path: willdeep-agent/go.sum

      - name: Print toolchain
        run: go version

      - name: Run Go agent tests
        run: go test ./...
        working-directory: willdeep-agent

  mac-unit-tests:
    name: XeditTests (macOS)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 插件已经拆成独立仓库，PluginExamples/ 下是 submodule。不拉的话
          # 那里是 11 个空目录，构建会在拷贝内置插件那一步炸。
          submodules: recursive

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcode-select -p
          xcodebuild -version

      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Print toolchain
        run: |
          xcodebuild -version
          swift --version
          ruby --version
          sw_vers || true

      - name: Configure private SPM access
        env:
          SOMEIM_DEPLOY_KEY: ${{ secrets.SOMEIM_DEPLOY_KEY }}
        run: ruby scripts/configure_ci_private_spm.rb

      - name: Run xcresult report contract guard
        run: ruby scripts/xcresult_report_contract_test.rb build/ci/xcresult_report_contract_report.md build/ci/xcresult_report_contract_report.json

      - name: Build test products
        run: |
          CACHE_ROOT="${HOME}/Library/Caches/WillDeepCI/Xcode/${RUNNER_NAME:-default}"
          DERIVED_DATA="${CACHE_ROOT}/DerivedData"
          SOURCE_PACKAGES="${CACHE_ROOT}/SourcePackages"
          PACKAGE_CACHE="${CACHE_ROOT}/PackageCache"
          mkdir -p build/ci "$DERIVED_DATA" "$SOURCE_PACKAGES" "$PACKAGE_CACHE"
          ruby scripts/xcodebuild_ci.rb \
            --log build/ci/xcodebuild-build.log \
            --pass-grace 180 \
            --idle-timeout 180 \
            -- \
            xcodebuild build-for-testing \
              -project Xedit.xcodeproj \
              -scheme XeditUnitTests \
              -destination 'platform=macOS' \
              -resultBundlePath build/ci/XeditBuild.xcresult \
              -derivedDataPath "$DERIVED_DATA" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
              -packageCachePath "$PACKAGE_CACHE" \
              -skipPackageUpdates \
              -onlyUsePackageVersionsFromResolvedFile \
              -enableCodeCoverage NO \
              -showBuildTimingSummary \
              COMPILATION_CACHE_ENABLE_CACHING=YES \
              COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

      - name: Run tests without rebuilding
        id: tests
        run: |
          CACHE_ROOT="${HOME}/Library/Caches/WillDeepCI/Xcode/${RUNNER_NAME:-default}"
          DERIVED_DATA="${CACHE_ROOT}/DerivedData"
          SOURCE_PACKAGES="${CACHE_ROOT}/SourcePackages"
          PACKAGE_CACHE="${CACHE_ROOT}/PackageCache"
          ruby scripts/xcodebuild_ci.rb \
            --log build/ci/xcodebuild-test.log \
            --pass-grace 180 \
            --idle-timeout 180 \
            -- \
            xcodebuild test-without-building \
              -project Xedit.xcodeproj \
              -scheme XeditUnitTests \
              -destination 'platform=macOS' \
              -only-testing:XeditTests \
              -resultBundlePath build/ci/XeditTests.xcresult \
              -derivedDataPath "$DERIVED_DATA" \
              -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
              -packageCachePath "$PACKAGE_CACHE" \
              -skipPackageUpdates \
              -onlyUsePackageVersionsFromResolvedFile \
              -enableCodeCoverage NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

      - name: Generate Markdown and JSON report
        if: always()
        # --test-exit keeps the report honest when the bundle disagrees with the
        # run: a step that failed can never come back as "status": "passed".
        run: ruby scripts/xcresult_report.rb build/ci/XeditTests.xcresult build/ci/report.md build/ci/report.json --log build/ci/xcodebuild-test.log --test-exit ${{ steps.tests.outcome == 'success' && '0' || '1' }}

      - name: Append report to job summary
        if: always()
        run: ruby scripts/ci_append_markdown.rb build/ci/report.md

      - name: Upload test artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: xedit-test-results
          path: |
            build/ci/XeditBuild.xcresult
            build/ci/XeditTests.xcresult
            build/ci/report.md
            build/ci/report.json
            build/ci/xcodebuild-build.log
            build/ci/xcodebuild-test.log
          retention-days: 7
