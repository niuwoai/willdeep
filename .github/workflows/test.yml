name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: XeditTests (macOS)
    # rc10: 升到 macos-26 runner —— 项目 MACOSX_DEPLOYMENT_TARGET = 26.4
    # （Tahoe），之前的 macos-15 runner（macOS 15.7.x + Xcode 16）xcodebuild
    # 直接拒绝："My Mac's macOS 15.7.x doesn't match XeditTests's macOS 26.4
    # deployment target."，CI 从 rc1 起就一直红着。macos-26 runner 2026-02
    # 已 GA，默认 Xcode 26.4.1，正好匹配部署目标。runner image manifest 见
    # actions/runner-images / images/macos/macos-26-arm64-Readme.md。
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        # 优先锁定 Xcode 26.4.1（明确匹配 MACOSX_DEPLOYMENT_TARGET 26.4）；
        # 当 GitHub 后续把默认 Xcode 又前进一档时，回退到 Xcode.app 软链。
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app || sudo xcode-select -s /Applications/Xcode.app

      # SwiftTerm (terminal panel dependency) compiles a Metal shader
      # (Apple/Metal/Shaders.metal). Xcode 26 ships the Metal compiler as
      # an on-demand component, so ensure it's present before building.
      # Idempotent + fast when the runner image already has it.
      - name: Ensure Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Print toolchain
        run: |
          xcodebuild -version
          swift --version
          ruby --version

      - name: List schemes
        run: xcodebuild -project Xedit.xcodeproj -list

      - name: Run complexity guard
        run: ruby scripts/complexity_guard.rb build/ci/complexity_report.md build/ci/complexity_report.json

      - name: Run version consistency
        run: ruby scripts/version_consistency.rb build/ci/version_report.md build/ci/version_report.json

      # 守住简体中文翻译覆盖率:可翻译文案缺 zh-Hans 即报红,防止新增 key
      # 漏翻让中文用户回落英文。纯符号/格式串自动豁免。
      - name: Run i18n coverage guard
        run: ruby scripts/i18n_coverage_guard.rb build/ci/i18n_report.md build/ci/i18n_report.json

      # macos-26 runner 默认不带 Go toolchain，少了这步 `go test` 直接
      # `command not found`（exit 127），CI 从加进 Go 测试那次起就一直红。
      - name: Set up Go
        # v6 runs on Node.js 24; v5 targeted the now-deprecated Node 20
        # compat shim and emitted a deprecation annotation on every run.
        uses: actions/setup-go@v6
        with:
          go-version-file: willdeep-agent/go.mod
          cache-dependency-path: willdeep-agent/go.sum

      - name: Run Go agent tests
        run: go test ./...
        working-directory: willdeep-agent

      - name: Run XeditTests
        id: tests
        run: |
          mkdir -p build/ci
          ruby scripts/xcodebuild_ci.rb --log build/ci/xcodebuild.log --pass-grace 180 --idle-timeout 180 -- \
            xcodebuild test \
            -project Xedit.xcodeproj \
            -scheme Xedit \
            -destination 'platform=macOS' \
            -only-testing:XeditTests \
            -resultBundlePath build/ci/XeditTests.xcresult \
            -derivedDataPath build/ci/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Generate Markdown + JSON report
        if: always()
        run: ruby scripts/xcresult_report.rb build/ci/XeditTests.xcresult build/ci/report.md build/ci/report.json

      - name: Append report to job summary
        if: always()
        run: |
          cat build/ci/complexity_report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat build/ci/version_report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat build/ci/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xedit-test-results
          path: |
            build/ci/XeditTests.xcresult
            build/ci/report.md
            build/ci/report.json
            build/ci/complexity_report.md
            build/ci/complexity_report.json
            build/ci/version_report.md
            build/ci/version_report.json
            build/ci/xcodebuild.log
          retention-days: 14
